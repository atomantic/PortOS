name: Install CI verification tools
description: >-
  Audio verification tools, with an optional PostgreSQL client matching the
  DB service major, through a cache of APT package downloads.

inputs:
  pg-major:
    description: The PostgreSQL service major required when include-postgres is true.
    default: ''
  include-postgres:
    description: Whether to install the PostgreSQL client alongside ffmpeg.
    default: 'true'

runs:
  using: composite
  steps:
    # Cache only package downloads. The helper verifies restored bytes against
    # fresh signed indexes; cache hits never skip setup.
    - name: Identify APT package cache
      id: apt-cache
      shell: bash
      env:
        PG_MAJOR: ${{ inputs.pg-major }}
        INCLUDE_POSTGRES: ${{ inputs.include-postgres }}
      run: |
        . /etc/os-release
        toolset=ffmpeg
        if [[ "$INCLUDE_POSTGRES" == true ]]; then
          toolset="pg${PG_MAJOR}-ffmpeg"
        fi
        prefix="apt-debs-v1-${ID}-${VERSION_ID}-$(dpkg --print-architecture)-${toolset}-${{ hashFiles('scripts/ci-install-db-tools.sh') }}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        # Refresh immutable entries daily as signed package indexes evolve.
        echo "key=${prefix}$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

    # A PR-saved cache is private to its merge ref and never read again, so PRs only restore.
    - name: Cache APT package downloads (restore only on pull requests)
      if: github.event_name == 'pull_request'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/portos-apt-packages/*.deb
        key: ${{ steps.apt-cache.outputs.key }}
        restore-keys: ${{ steps.apt-cache.outputs.prefix }}

    - name: Cache APT package downloads
      if: github.event_name != 'pull_request'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/portos-apt-packages/*.deb
        key: ${{ steps.apt-cache.outputs.key }}
        restore-keys: ${{ steps.apt-cache.outputs.prefix }}

    # Preserve bounded mirror fallback on a miss; the caller's step timeout
    # backs up the helper's 390-second download budget.
    - name: Install the selected tools
      shell: bash
      env:
        PG_MAJOR: ${{ inputs.pg-major }}
        INCLUDE_POSTGRES: ${{ inputs.include-postgres }}
        APT_PACKAGE_CACHE: ${{ runner.temp }}/portos-apt-packages
      run: bash scripts/ci-install-db-tools.sh
