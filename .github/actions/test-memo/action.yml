name: Restore the test memo
description: >-
  Restore the trusted test memo (docs/TEST_MEMO.md) for one
  job partition. The job saves it afterwards with actions/cache/save, passing
  the same runner-temp `portos-test-memo` path and this action's `key`
  output, and only from a trusted green run.

inputs:
  suite:
    description: The job family (server, client, db, browser, windows-server); the fallback restore prefix.
    required: true
  partition:
    description: >-
      The job family plus its shard (e.g. `server-1of4`), or the family alone
      for an unsharded job. The preferred restore prefix and the saved key.
    required: true
  merge-shards:
    description: >-
      The family's full-run shard count (FULL_SUITE_SHARDS in
      scripts/ci-test-plan.js), or 0. When set, restore and merge every
      distinct full-run shard lineage so related selection can use records
      from all shards. Up to 7.
    required: false
    default: '0'
  merge-partitions:
    description: JSON list of specific full-run shard indexes to merge, or [] for all when merge-shards is set.
    required: false
    default: '[]'
  partition-only:
    description: Limit the restore to the requested partition lineage.
    required: false
    default: 'false'

outputs:
  key:
    description: This run's save key.
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    # The runner skips a selected test file whose every input — loaded
    # modules, fixtures, package versions, Node/platform, gating env — is
    # byte-identical to one a trusted green run verified. Pull requests only
    # read. Pushes to main and the scheduled, dispatched and called full runs
    # save, so the cache holds nothing a PR branch wrote. Prefer the same
    # partition's lineage, then any shard of this job family when allowed: scoped 1of1
    # plans have no full-run seed of their own. OS and architecture are in
    # every key, so a platform reads only its own verdicts. Per-test content
    # keys still decide reuse; unmatched files run normally.
    - name: Restore from the trusted memo cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/portos-test-memo
        key: test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.partition }}-${{ github.run_id }}
        restore-keys: |
          test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.partition }}-
          ${{ inputs.partition-only != 'true' && format('test-memo-{0}-{1}-{2}-', runner.os, runner.arch, inputs.suite) || '' }}

    # A shard records only the tests in its slice. Related selection narrows
    # a test only through its own record (scripts/lib/testMemo.js
    # recordedReach), so a scoped 1of1 job that restored one shard would
    # select the other shards' tests unnarrowed. Same trusted lineages, same
    # read-only rule; the merge keeps the newer record per test.
    # A cache version hashes the restore path, so a shard lineage restores only
    # to the path it was saved from (portos-test-memo). Park each restore
    # before the next one reuses that path. The actual matched key identifies
    # the lineage already parked, including a fallback to another shard.
    - name: Park the job's own restore
      if: fromJSON(inputs.merge-shards) >= 1
      shell: bash
      run: |
        if [ -d "$RUNNER_TEMP/portos-test-memo" ]; then
          mkdir -p "$RUNNER_TEMP/portos-test-memo-shards"
          mv "$RUNNER_TEMP/portos-test-memo" "$RUNNER_TEMP/portos-test-memo-shards/0"
        fi

    - name: Restore full-run shard 1 of the memo
      id: restore-shard-1
      if: >-
        fromJSON(inputs.merge-shards) >= 1 &&
        (inputs.merge-partitions == '[]' || contains(fromJSON(inputs.merge-partitions), 1)) &&
        !startsWith(steps.restore.outputs.cache-matched-key, format('test-memo-{0}-{1}-{2}-1of{3}-', runner.os, runner.arch, inputs.suite, inputs.merge-shards))
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/portos-test-memo
        key: test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-1of${{ inputs.merge-shards }}-
        restore-keys: |
          test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-1of${{ inputs.merge-shards }}-

    - name: Park full-run shard 1
      if: steps.restore-shard-1.outcome == 'success'
      shell: bash
      run: |
        if [ -d "$RUNNER_TEMP/portos-test-memo" ]; then
          mkdir -p "$RUNNER_TEMP/portos-test-memo-shards"
          mv "$RUNNER_TEMP/portos-test-memo" "$RUNNER_TEMP/portos-test-memo-shards/1"
        fi

    - name: Restore full-run shard 2 of the memo
      id: restore-shard-2
      if: >-
        fromJSON(inputs.merge-shards) >= 2 &&
        (inputs.merge-partitions == '[]' || contains(fromJSON(inputs.merge-partitions), 2)) &&
        !startsWith(steps.restore.outputs.cache-matched-key, format('test-memo-{0}-{1}-{2}-2of{3}-', runner.os, runner.arch, inputs.suite, inputs.merge-shards))
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/portos-test-memo
        key: test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-2of${{ inputs.merge-shards }}-
        restore-keys: |
          test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-2of${{ inputs.merge-shards }}-

    - name: Park full-run shard 2
      if: steps.restore-shard-2.outcome == 'success'
      shell: bash
      run: |
        if [ -d "$RUNNER_TEMP/portos-test-memo" ]; then
          mkdir -p "$RUNNER_TEMP/portos-test-memo-shards"
          mv "$RUNNER_TEMP/portos-test-memo" "$RUNNER_TEMP/portos-test-memo-shards/2"
        fi

    - name: Restore full-run shard 3 of the memo
      id: restore-shard-3
      if: >-
        fromJSON(inputs.merge-shards) >= 3 &&
        (inputs.merge-partitions == '[]' || contains(fromJSON(inputs.merge-partitions), 3)) &&
        !startsWith(steps.restore.outputs.cache-matched-key, format('test-memo-{0}-{1}-{2}-3of{3}-', runner.os, runner.arch, inputs.suite, inputs.merge-shards))
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/portos-test-memo
        key: test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-3of${{ inputs.merge-shards }}-
        restore-keys: |
          test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-3of${{ inputs.merge-shards }}-

    - name: Park full-run shard 3
      if: steps.restore-shard-3.outcome == 'success'
      shell: bash
      run: |
        if [ -d "$RUNNER_TEMP/portos-test-memo" ]; then
          mkdir -p "$RUNNER_TEMP/portos-test-memo-shards"
          mv "$RUNNER_TEMP/portos-test-memo" "$RUNNER_TEMP/portos-test-memo-shards/3"
        fi

    - name: Restore full-run shard 4 of the memo
      id: restore-shard-4
      if: >-
        fromJSON(inputs.merge-shards) >= 4 &&
        (inputs.merge-partitions == '[]' || contains(fromJSON(inputs.merge-partitions), 4)) &&
        !startsWith(steps.restore.outputs.cache-matched-key, format('test-memo-{0}-{1}-{2}-4of{3}-', runner.os, runner.arch, inputs.suite, inputs.merge-shards))
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/portos-test-memo
        key: test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-4of${{ inputs.merge-shards }}-
        restore-keys: |
          test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-4of${{ inputs.merge-shards }}-

    - name: Park full-run shard 4
      if: steps.restore-shard-4.outcome == 'success'
      shell: bash
      run: |
        if [ -d "$RUNNER_TEMP/portos-test-memo" ]; then
          mkdir -p "$RUNNER_TEMP/portos-test-memo-shards"
          mv "$RUNNER_TEMP/portos-test-memo" "$RUNNER_TEMP/portos-test-memo-shards/4"
        fi

    - name: Restore full-run shard 5 of the memo
      id: restore-shard-5
      if: >-
        fromJSON(inputs.merge-shards) >= 5 &&
        (inputs.merge-partitions == '[]' || contains(fromJSON(inputs.merge-partitions), 5)) &&
        !startsWith(steps.restore.outputs.cache-matched-key, format('test-memo-{0}-{1}-{2}-5of{3}-', runner.os, runner.arch, inputs.suite, inputs.merge-shards))
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/portos-test-memo
        key: test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-5of${{ inputs.merge-shards }}-
        restore-keys: |
          test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-5of${{ inputs.merge-shards }}-

    - name: Park full-run shard 5
      if: steps.restore-shard-5.outcome == 'success'
      shell: bash
      run: |
        if [ -d "$RUNNER_TEMP/portos-test-memo" ]; then
          mkdir -p "$RUNNER_TEMP/portos-test-memo-shards"
          mv "$RUNNER_TEMP/portos-test-memo" "$RUNNER_TEMP/portos-test-memo-shards/5"
        fi

    - name: Restore full-run shard 6 of the memo
      id: restore-shard-6
      if: >-
        fromJSON(inputs.merge-shards) >= 6 &&
        (inputs.merge-partitions == '[]' || contains(fromJSON(inputs.merge-partitions), 6)) &&
        !startsWith(steps.restore.outputs.cache-matched-key, format('test-memo-{0}-{1}-{2}-6of{3}-', runner.os, runner.arch, inputs.suite, inputs.merge-shards))
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/portos-test-memo
        key: test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-6of${{ inputs.merge-shards }}-
        restore-keys: |
          test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-6of${{ inputs.merge-shards }}-

    - name: Park full-run shard 6
      if: steps.restore-shard-6.outcome == 'success'
      shell: bash
      run: |
        if [ -d "$RUNNER_TEMP/portos-test-memo" ]; then
          mkdir -p "$RUNNER_TEMP/portos-test-memo-shards"
          mv "$RUNNER_TEMP/portos-test-memo" "$RUNNER_TEMP/portos-test-memo-shards/6"
        fi

    - name: Restore full-run shard 7 of the memo
      id: restore-shard-7
      if: >-
        fromJSON(inputs.merge-shards) >= 7 &&
        (inputs.merge-partitions == '[]' || contains(fromJSON(inputs.merge-partitions), 7)) &&
        !startsWith(steps.restore.outputs.cache-matched-key, format('test-memo-{0}-{1}-{2}-7of{3}-', runner.os, runner.arch, inputs.suite, inputs.merge-shards))
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/portos-test-memo
        key: test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-7of${{ inputs.merge-shards }}-
        restore-keys: |
          test-memo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.suite }}-7of${{ inputs.merge-shards }}-

    - name: Park full-run shard 7
      if: steps.restore-shard-7.outcome == 'success'
      shell: bash
      run: |
        if [ -d "$RUNNER_TEMP/portos-test-memo" ]; then
          mkdir -p "$RUNNER_TEMP/portos-test-memo-shards"
          mv "$RUNNER_TEMP/portos-test-memo" "$RUNNER_TEMP/portos-test-memo-shards/7"
        fi

    # A trusted run records into the merged store and saves it, so it needs
    # one writable directory. The save prunes it first (pruneTestMemo in
    # scripts/lib/testMemoRunner.js), which keeps this copy small.
    - name: Merge the full-run shard lineages
      if: fromJSON(inputs.merge-shards) >= 1 && github.event_name != 'pull_request'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/portos-test-memo" "$RUNNER_TEMP/portos-test-memo-shards"
        node scripts/merge-test-memo.js "$RUNNER_TEMP/portos-test-memo" "$RUNNER_TEMP"/portos-test-memo-shards/*

    # A pull request only reads, and its store is discarded with the job, so
    # copying every parked entry into one directory was pure overhead (#17617).
    # The runner reads the parked lineages in place instead: the first valid
    # entry across them, and per test the newest record, which is what the
    # merge would have kept (scripts/lib/testMemoStore.js).
    - name: Read the full-run shard lineages in place
      if: fromJSON(inputs.merge-shards) >= 1 && github.event_name == 'pull_request'
      shell: bash
      run: |
        separator=':'
        if [ "$RUNNER_OS" = Windows ]; then separator=';'; fi
        dirs=''
        for dir in "$RUNNER_TEMP"/portos-test-memo-shards/*; do
          if [ -d "$dir" ]; then dirs="${dirs:+$dirs$separator}$dir"; fi
        done
        echo "PORTOS_TEST_MEMO_READ_DIRS=$dirs" >> "$GITHUB_ENV"
