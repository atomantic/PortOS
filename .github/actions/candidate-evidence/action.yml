name: Retain frozen candidate invocation evidence
description: >-
  Upload the runner's bounded invocation/run/failure/process evidence for a
  frozen release-candidate pull request (docs/GITHUB_ACTIONS.md "Bounded frozen
  release-candidate failure collection"). The caller gates the step on
  `always() && env.PORTOS_CI_TEST_POLICY == 'release-candidate'`.

inputs:
  name:
    description: Artifact name, unique per job and matrix leg.
    required: true

runs:
  using: composite
  steps:
    # `always()` again here: the caller already decided this run retains
    # evidence, including after a failed test step.
    - name: Upload the invocation evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        retention-days: 7
        if-no-files-found: warn
        path: |
          ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/invocation.json
          ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/run.json
          ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/failures.json
          ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/processes.json
