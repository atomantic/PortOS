name: Set up the client workspace
description: >-
  A cached client/node_modules (exact key, install skipped on a hit), with
  Node 26 unless the job already set Node up. Shared by every ci.yml job that
  installs the client workspace.

inputs:
  setup-node:
    description: "'false' when an earlier step (setup-server) already selected Node 26."
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Use Node.js 26.x
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.x
        package-manager-cache: false

    # As with setup-server, only an exact cache hit can skip the clean install.
    #
    # No rebuild half, unlike the server: client/.npmrc pins
    # ignore-scripts=true AND `scripts/trusted-rebuilds.js` deliberately lists
    # nothing for this workspace, so a restored tree is usable as-is and the
    # install can be skipped outright on a hit. That premise is HASHED, not
    # assumed: `trusted-rebuilds.js` is in the key, so the day a client
    # dependency does need a rebuild the key moves and no job can keep
    # restoring a never-rebuilt tree on an exact hit — which no job here has a
    # stamp check to notice.
    - name: Cache client node_modules
      id: client-modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: client/node_modules
        key: client-modules-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('client/package-lock.json', 'client/package.json', 'client/.npmrc', 'scripts/trusted-rebuilds.js') }}

    - name: Locate the client npm cache
      id: client-npm-cache
      if: steps.client-modules.outputs.cache-hit != 'true'
      working-directory: client
      shell: bash
      run: |
        cache_path=$(npm config get cache)
        # Native npm on Windows can leave a trailing carriage return.
        printf 'path=%s\n' "${cache_path%$'\r'}" >> "$GITHUB_OUTPUT"

    # Pull requests only restore package downloads because their caches are
    # scoped to the PR merge ref.
    - name: Restore client npm downloads
      if: steps.client-modules.outputs.cache-hit != 'true' && github.event_name == 'pull_request'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.client-npm-cache.outputs.path }}
        key: npm-cache-client-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('client/package-lock.json') }}
        restore-keys: npm-cache-client-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache client npm downloads
      if: steps.client-modules.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.client-npm-cache.outputs.path }}
        key: npm-cache-client-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('client/package-lock.json') }}
        restore-keys: npm-cache-client-${{ runner.os }}-${{ runner.arch }}-

    - name: Install client dependencies
      if: steps.client-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefix client
