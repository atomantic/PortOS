name: PR description

# A squash merge copies the pull request's description into main's commit
# message, so a session link there lands in permanent history. `edited` keeps
# the check current: a description changed after CI went green re-runs it, and
# fixing a flagged description turns it green without re-running CI.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [main, release]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-description-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  session-links:
    name: Refuse AI session links in the PR description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts
      # Reads the description live from the API rather than the event payload,
      # so re-running this job after an edit checks the current text.
      - name: Scan the PR description
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/scan-commit-session-links.js --description
