name: CI

on:
  # No push trigger. Every change reaches `main` through a pull request whose
  # own CI gate must be green, so re-running the suite on the merge commit only
  # repeats work. The nightly schedule below is the main-branch health signal,
  # and the candidate -> release pull request runs the complete suite before a
  # release ships.
  pull_request:
    branches: [main, release]
  schedule:
    # Twice a day: with no push trigger these are the only runs that test the
    # combined tree, so the second bounds how long a bad merge can hide.
    - cron: '17 9 * * *'
    - cron: '17 21 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run the complete server, client, DB, lint, build, and smoke suite
        required: false
        type: boolean
        default: true

# Explicit opt-in: no ordinary PR, nightly, or release push changes policy.
env:
  PORTOS_CI_TEST_POLICY: ${{ github.event_name == 'pull_request' && github.base_ref == 'release' && startsWith(github.head_ref, 'codex/release-') && github.event.pull_request.head.repo.full_name == github.repository && 'release-candidate' || '' }}
  PORTOS_CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
  PORTOS_CI_CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Plan test impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Still live despite the removed push trigger: a called workflow inherits
    # the caller's event, and release.yml calls this one from a push.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      reason: ${{ steps.plan.outputs.reason }}
      server_mode: ${{ steps.plan.outputs.server_mode }}
      server_files: ${{ steps.plan.outputs.server_files }}
      server_sources: ${{ steps.plan.outputs.server_sources }}
      client_mode: ${{ steps.plan.outputs.client_mode }}
      client_files: ${{ steps.plan.outputs.client_files }}
      client_sources: ${{ steps.plan.outputs.client_sources }}
      db: ${{ steps.plan.outputs.db }}
      browser_files: ${{ steps.plan.outputs.browser_files }}
      lint_mode: ${{ steps.plan.outputs.lint_mode }}
      lint_files: ${{ steps.plan.outputs.lint_files }}
      build: ${{ steps.plan.outputs.build }}
      smoke: ${{ steps.plan.outputs.smoke }}
      slashdo: ${{ steps.plan.outputs.slashdo }}
      # Path-gated single-purpose jobs: true on a forced-full run, else only
      # when the diff reaches the job's import closure (scripts/ci-test-plan.js).
      prompt_history: ${{ steps.plan.outputs.prompt_history }}
      linux_containment: ${{ steps.plan.outputs.linux_containment }}
      supercollider_live: ${{ steps.plan.outputs.supercollider_live }}
      docker_containment_live: ${{ steps.plan.outputs.docker_containment_live }}
      windows: ${{ steps.plan.outputs.windows }}
      windows_mode: ${{ steps.plan.outputs.windows_mode }}
      windows_files: ${{ steps.plan.outputs.windows_files }}
      windows_sources: ${{ steps.plan.outputs.windows_sources }}
      # JSON arrays of shard indexes — `[1]` for a scoped plan, `[1..n]` for a
      # full one. Each leaf job builds its matrix from these, because a
      # job-level `if` cannot read `matrix` and so cannot skip extra shards on
      # its own. See FULL_SUITE_SHARDS in scripts/ci-test-plan.js.
      server_shards: ${{ steps.plan.outputs.server_shards }}
      client_shards: ${{ steps.plan.outputs.client_shards }}
      windows_shards: ${{ steps.plan.outputs.windows_shards }}
      suite_reasons: ${{ steps.plan.outputs.suite_reasons }}
      node_minimum: ${{ steps.node-minimum.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 2, not full history: a pull_request checkout is the merge ref,
          # so depth 2 carries both of its parents — which is everything the
          # planner (a three-dot diff against the base parent) and `git
          # ls-files` need. Cloning every commit in the repo buys nothing more.
          fetch-depth: 2

      # A red impact job keeps CI Gate red; skipped test jobs are not evidence.
      # Re-running this run is GitHub's writer-only, exact-SHA release control.
      - name: Require maintainer release for Dependabot
        run: node scripts/ci-impact-diagnostics.js admission -- node scripts/ci-dependabot-admission.js

      # Reads the base commit off HEAD^1 rather than the event payload, so a
      # depth-2 clone is enough for every three-dot diff downstream. Exports
      # CI_BASE_SHA to the rest of the job.
      - name: Resolve the pull-request diff base
        run: node scripts/ci-impact-diagnostics.js base -- node scripts/ci-base-sha.js

      # Before any reviewer — human or model — reads this diff. Pattern
      # matching over the added lines only: invisible Unicode and compressed or
      # opaque encoded payloads are content the diff hides from the person
      # approving it, so a hit fails the run rather than being reported. Every
      # other job needs this one, so the whole suite stops here.
      - name: Scan the diff for hidden content
        run: node scripts/ci-impact-diagnostics.js hidden-content -- node scripts/scan-diff-hidden-content.js

      # Linux resolves `./Foo.js` only as spelled; macOS and Windows do not, so
      # a macOS-only run cannot see that failure. Checked here on every pull
      # request.
      - name: Check relative imports match the tracked path case
        run: node scripts/ci-impact-diagnostics.js import-case -- node scripts/check-import-case.js

      - name: Select affected test surfaces
        id: plan
        env:
          # `inputs.full` is only decisive for a caller that invokes this
          # reusable workflow from a pull_request-triggered workflow — every
          # call site in this repo comes from a push, which the first clause
          # already covers. It stays honored so the declared input is real.
          CI_FORCE_FULL: ${{ github.event_name != 'pull_request' || inputs.full == true }}
          # The planner turns a PR into `release` into a full plan: that PR is
          # the single gate a release ships behind, so it never runs scoped.
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/ci-impact-diagnostics.js plan -- node scripts/ci-test-plan.js

      # The Node-minimum job proves the lockfiles install and the runtime gate
      # loads on the oldest supported Node. Only these files can change that
      # answer, so a PR that touches none of them skips it; non-PR runs always
      # run it.
      - name: Decide whether the Node minimum check applies
        id: node-minimum
        env:
          CI_EVENT: ${{ github.event_name }}
        run: |
          node scripts/ci-impact-diagnostics.js node-minimum -- bash --noprofile --norc -e -o pipefail -s <<'PORTOS_IMPACT_SCRIPT'
          pattern='^((server/|client/|autofixer/)?(package(-lock)?\.json|\.npmrc)|\.nvmrc|scripts/checkNodeVersion(\.test)?\.js|scripts/lib/directInvocation\.js|scripts/node-version-drift\.test\.js|\.github/workflows/ci\.yml)$'
          if [ "$CI_EVENT" != pull_request ] || git diff --name-only "$CI_BASE_SHA"...HEAD | grep -qE "$pattern"; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi
          PORTOS_IMPACT_SCRIPT

      - name: Publish plan summary
        env:
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
          SERVER_MODE: ${{ steps.plan.outputs.server_mode }}
          CLIENT_MODE: ${{ steps.plan.outputs.client_mode }}
          DB_MODE: ${{ steps.plan.outputs.db }}
          BROWSER_FILES: ${{ steps.plan.outputs.browser_files }}
          LINT_MODE: ${{ steps.plan.outputs.lint_mode }}
          BUILD_MODE: ${{ steps.plan.outputs.build }}
          SMOKE_MODE: ${{ steps.plan.outputs.smoke }}
          SLASHDO_MODE: ${{ steps.plan.outputs.slashdo }}
          PROMPT_HISTORY_MODE: ${{ steps.plan.outputs.prompt_history }}
          LINUX_CONTAINMENT_MODE: ${{ steps.plan.outputs.linux_containment }}
          SUPERCOLLIDER_LIVE_MODE: ${{ steps.plan.outputs.supercollider_live }}
          DOCKER_CONTAINMENT_LIVE_MODE: ${{ steps.plan.outputs.docker_containment_live }}
          NODE_MINIMUM_MODE: ${{ steps.node-minimum.outputs.run }}
          WINDOWS_MODE: ${{ steps.plan.outputs.windows }}
          WINDOWS_TEST_MODE: ${{ steps.plan.outputs.windows_mode }}
          SERVER_SHARDS: ${{ steps.plan.outputs.server_shards }}
          CLIENT_SHARDS: ${{ steps.plan.outputs.client_shards }}
          WINDOWS_SHARDS: ${{ steps.plan.outputs.windows_shards }}
          SUITE_REASONS: ${{ steps.plan.outputs.suite_reasons }}
        run: |
          node scripts/ci-impact-diagnostics.js summary -- bash --noprofile --norc -e -o pipefail -s <<'PORTOS_IMPACT_SCRIPT'
          {
            echo "### CI impact plan"
            echo
            echo "- Reason: \`${PLAN_REASON}\`"
            echo "- Server tests: \`${SERVER_MODE}\` (shards \`${SERVER_SHARDS}\`)"
            echo "- Client tests: \`${CLIENT_MODE}\` (shards \`${CLIENT_SHARDS}\`)"
            echo "- DB tests: \`${DB_MODE}\`"
            echo "- Cross-workspace browser suites: \`${BROWSER_FILES}\`"
            echo "- Client lint: \`${LINT_MODE}\`"
            echo "- Client build: \`${BUILD_MODE}\`"
            echo "- Server smoke: \`${SMOKE_MODE}\`"
            echo "- Slashdo submodule: \`${SLASHDO_MODE}\`"
            echo "- Shipped prompt history: \`${PROMPT_HISTORY_MODE}\`"
            echo "- Linux worker containment: \`${LINUX_CONTAINMENT_MODE}\`"
            echo "- SuperCollider live containment: \`${SUPERCOLLIDER_LIVE_MODE}\`"
            echo "- Docker containment live: \`${DOCKER_CONTAINMENT_LIVE_MODE}\`"
            echo "- Node minimum compatibility: \`${NODE_MINIMUM_MODE}\`"
            echo "- Windows server tests: \`${WINDOWS_MODE}\` (\`${WINDOWS_TEST_MODE}\`, shards \`${WINDOWS_SHARDS}\`)"
            echo "- Suite selection reasons: \`${SUITE_REASONS}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          PORTOS_IMPACT_SCRIPT

      # `autofixer/` is a real install target — its own package.json, its own
      # tracked lockfile, its own .npmrc — installed by `npm run setup` and by
      # scripts/ensure-deps.js on every `npm start`. Nothing else in CI resolves
      # it, so a lockfile that no longer installs (a yanked version, a corrupted
      # integrity hash, a manifest/lockfile mismatch) would ship green and only
      # break on a user's machine at setup time. The parity assertions in
      # server/dependency-overrides.test.js are static — they parse the JSON;
      # only `npm ci` proves the tree still resolves.
      #
      # Here rather than on the server job because this job always runs
      # and this check must never be skipped with it. Deliberately uncached and ungated: a cache hit that skipped
      # the install would skip the very check this step exists for. 67
      # packages, well under a second, on the runner's own Node (no setup-node
      # in this job; the lockfile resolves the same on any supported major).
      #
      # No rebuild step follows. autofixer/.npmrc pins ignore-scripts=true and
      # scripts/trusted-rebuilds.js deliberately lists no rebuilds for this
      # workspace, because nothing it depends on ships a native addon.
      - name: Install autofixer dependencies
        run: node scripts/ci-impact-diagnostics.js autofixer-install -- npm ci --prefix autofixer

      # Same reason: the entry-point syntax check must not ride a skippable job.
      - name: Check server entry-point syntax
        run: node scripts/ci-impact-diagnostics.js syntax -- node --check server/index.js

      # This precedes checkout post-actions and runner finalization; it cannot
      # attest that the hosted runner acknowledged the completed job.
      - name: Record impact process settlement
        if: always()
        run: node scripts/ci-impact-diagnostics.js settlement

  prompt-history:
    name: Shipped prompt history
    needs: impact
    if: needs.impact.outputs.prompt_history == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x

      - name: Check shipped stage-prompt history
        run: node scripts/migrations/check-shipped-prompt-history.js

  server:
    # Sharded on a full plan — see docs/GITHUB_ACTIONS.md "Full-suite sharding".
    # The matrix comes from the planner; once-only steps pin to shard 1, and the
    # transform-artifact cache key carries the shard so parallel saves don't race.
    name: Server tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: impact
    if: needs.impact.outputs.server_mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A failing shard must not cancel its siblings: "Re-run failed jobs"
      # then repeats only the red shard instead of the whole matrix.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.impact.outputs.server_shards) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # See the impact job: depth 2 is the whole PR merge ref, which is all
          # the planner needs to identify changed sources.
          fetch-depth: 2

      - name: Resolve the pull-request diff base
        run: node scripts/ci-base-sha.js

      - name: Use Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: server/package-lock.json

      # setup-node's npm cache only preserves ~/.npm, the tarball cache: `npm ci`
      # still wipes and repopulates a 570 MB node_modules on all three server
      # jobs. Cache the installed tree instead and skip the install on a hit.
      #
      # No restore-keys. The install below is skipped on a hit, so a near-miss
      # restore would silently ship a node_modules built from a different
      # lockfile. Exact key or nothing. package.json is in the hash alongside
      # the lockfile so that skipping `npm ci` does not also skip its
      # manifest-vs-lockfile check, and the key carries the Node *major* rather
      # than the resolved patch, because NODE_MODULE_VERSION is stable across
      # patches and keying on the patch would discard the entry on every Node
      # 26.x release. The transform-artifact cache below keeps its own key and
      # its own restore-keys; this one is about dependencies.
      #
      # Hit rate comes from the nightly full run: there is no push trigger on
      # `main`, so the 09:17 UTC schedule is what seeds these caches on the
      # default branch, which is the only scope every PR branch can read.
      # See docs/GITHUB_ACTIONS.md.
      - name: Cache server node_modules
        id: server-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/node_modules
          key: server-modules-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('server/package-lock.json', 'server/package.json', 'server/.npmrc', 'scripts/trusted-rebuilds.js') }}

      # A restored tree is only reusable if it was rebuilt before it was saved,
      # and that is not answerable by looking at the tree — with today's
      # versions the rebuild is nearly a no-op, so every allowlisted package
      # imports fine on a never-rebuilt one. The rebuild step below leaves an
      # explicit mark; this reads it back.
      #
      # `continue-on-error` on purpose: a bad entry must not wedge every PR
      # until a human clears the cache by hand. It fails, the two steps below
      # see a non-success outcome, and the job builds the tree it needs. It does
      # not *replace* the bad entry — cache keys are immutable and actions/cache
      # skips the save on an exact hit — so that entry keeps costing each run a
      # reinstall until the key moves or it ages out. That is precisely the
      # pre-cache cost: the worst case degrades to the old behaviour, never to a
      # red repo.
      #
      # `outcome != 'success'` covers all three cases in one expression: on a
      # cache miss this step is skipped (outcome `skipped`), on a hit it is
      # `success` or `failure`.
      - name: Check the restored node_modules was rebuilt
        id: server-modules-usable
        if: steps.server-modules.outputs.cache-hit == 'true'
        continue-on-error: true
        run: node scripts/trusted-rebuild-stamp.js check server

      - name: Install server dependencies
        if: steps.server-modules-usable.outcome != 'success'
        run: npm ci --prefix server

      # The server runner also globs ../autofixer/**/*.test.js (ui.js imports
      # express, resolved from autofixer/node_modules). Shards are separate
      # checkouts, so the impact job's resolution check does not reach them.
      - name: Install autofixer dependencies
        run: npm ci --prefix autofixer

      # server/.npmrc pins ignore-scripts=true, so the allowlisted packages need
      # this explicit rebuild. Same condition as the install: whenever this job
      # builds the tree it will cache, it must build a rebuilt one — and the
      # mark is written in the same block, so a failed rebuild cannot leave one
      # behind for a later job to trust.
      #
      # `shell: bash` is load-bearing, not style. windows-server would default
      # to pwsh, where a *native* command's non-zero exit neither throws nor
      # stops the block (`$PSNativeCommandUseErrorActionPreference` is false)
      # and only the last command's code becomes the step result — so a failed
      # rebuild would run the mark anyway, reset the exit code to 0, and publish
      # a green, marked, un-rebuilt tree. Under `bash -e` the block stops at
      # the rebuild, the job fails, and actions/cache (`post-if: success()`)
      # never saves it.
      - name: Rebuild trusted native dependencies
        if: steps.server-modules-usable.outcome != 'success'
        shell: bash
        env:
          # Skip onnxruntime-node's CUDA execution provider. Its postinstall
          # downloads it on linux-x64 whenever the .so is absent — several
          # hundred MB, on two jobs, every run — and no hosted runner has an
          # NVIDIA GPU to use it with. The CPU binaries ship in the tarball, so
          # inference still works; this is the single largest cost in the job.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          node scripts/trusted-rebuilds.js server
          node scripts/trusted-rebuild-stamp.js write server

      # Reuse Vite/Vitest artifacts from checkout-owned .cache paths, outside
      # node_modules (which may be shared by worktrees). Unlike the installed
      # dependency tree above, these artifacts can safely use a near-miss
      # restore and stay warm across a lockfile bump.
      - name: Cache Vitest transform artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/.cache/vitest
            server/.cache/vitest-db
          key: vitest-server-${{ runner.os }}-${{ hashFiles('server/package-lock.json', 'server/vitest.config.js', 'scripts/vitestCiPool.js') }}-${{ matrix.shard }}of${{ strategy.job-total }}
          restore-keys: |
            vitest-server-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}-
            vitest-server-${{ runner.os }}-

      # The submodule ships no source into this checkout by default (see
      # AGENTS.md "Slashdo Commands"), so the planner's `slashdo` output is
      # the only signal that the selected tests need it — an unrelated scoped
      # PR must not pay for the fetch. `CI_EXPECT_SLASHDO_SUBMODULE` below
      # tells the two contract suites to fail instead of skip if this step
      # somehow leaves the checkout without it.
      - name: Initialize slashdo submodule
        if: needs.impact.outputs.slashdo == 'true'
        run: git submodule update --init lib/slashdo

      # The test memo (docs/GITHUB_ACTIONS.md "Test memo"): the runner skips a
      # selected test file whose every input — loaded modules, fixtures,
      # package versions, Node/platform, gating env — is byte-identical to one
      # a trusted green run verified. Pull requests only read. The scheduled,
      # dispatched and called full runs save, so the cache holds nothing a PR
      # branch wrote. Prefer the same shard's lineage, then any shard of this
      # job: scoped 1of1 plans have no full-run seed of their own. Per-test
      # content keys still decide reuse; unmatched files run normally.
      - name: Restore the test memo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: test-memo-${{ runner.os }}-${{ runner.arch }}-server-${{ matrix.shard }}of${{ strategy.job-total }}-${{ github.run_id }}
          restore-keys: |
            test-memo-${{ runner.os }}-${{ runner.arch }}-server-${{ matrix.shard }}of${{ strategy.job-total }}-
            test-memo-${{ runner.os }}-${{ runner.arch }}-server-

      - name: Run server tests
        id: server-tests
        if: needs.impact.outputs.server_mode != 'skip'
        env:
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
          PORTOS_CI_BROWSER_OWNER: unit
          CI_TEST_MODE: ${{ needs.impact.outputs.server_mode }}
          CI_TEST_FILES: ${{ needs.impact.outputs.server_files }}
          CI_TEST_SOURCES: ${{ needs.impact.outputs.server_sources }}
          CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          CI_EXPECT_SLASHDO_SUBMODULE: ${{ needs.impact.outputs.slashdo }}
          # Keep successful-test output signal-dense. Developers can reproduce
          # locally without this flag when assertion context needs app logs.
          PORTOS_TEST_QUIET: 1
          # The documented local fallback; setting it avoids one warning per
          # isolated test file without changing DB selection or credentials.
          PGPASSWORD: portos
        run: node scripts/run-ci-tests.js server

      # Only trusted full runs on the default/release branches seed the memo,
      # and only from a green test step: the runner writes no entry from a
      # red process, and a step that never ran has nothing to save.
      - name: Save the test memo
        if: steps.server-tests.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: test-memo-${{ runner.os }}-${{ runner.arch }}-server-${{ matrix.shard }}of${{ strategy.job-total }}-${{ github.run_id }}

      # Smoke-boot does not need Postgres: NODE_ENV=test selects the file
      # backend. It does need the native rebuild (server boot loads node-pty),
      # which is why it lives on this job rather than a third installer.
      - name: Smoke-boot server
        if: needs.impact.outputs.smoke == 'true' && matrix.shard == 1
        run: npm run smoke

      - name: Retain frozen candidate invocation evidence
        if: always() && env.PORTOS_CI_TEST_POLICY == 'release-candidate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-diagnostics-server-${{ strategy.job-index || 0 }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/invocation.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/run.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/failures.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/processes.json

  client:
    # Sharded like the server job; the build and the bundle budget run on shard 1.
    # Lint is deliberately NOT here — it has its own job.
    name: Client tests and build (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: impact
    if: needs.impact.outputs.client_mode != 'skip' || needs.impact.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A failing shard must not cancel its siblings: "Re-run failed jobs"
      # then repeats only the red shard instead of the whole matrix.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.impact.outputs.client_shards) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # See the impact job: depth 2 is the whole PR merge ref, which is all
          # the planner needs to identify changed sources.
          fetch-depth: 2

      - name: Resolve the pull-request diff base
        run: node scripts/ci-base-sha.js

      - name: Use Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `setup-node`'s npm cache only preserves ~/.npm, the tarball cache, so
      # `npm ci` still wipes and repopulates client/node_modules (393 MB, 21k
      # files — MORE files than the server tree the sibling cache already
      # serves) on every one of the four jobs that install this workspace.
      # Same exact-key/no-restore-keys shape as `Cache server node_modules`, and
      # for the same reason: a near-miss tree is not safe to reuse.
      #
      # No rebuild half, unlike the server: client/.npmrc pins
      # ignore-scripts=true AND `scripts/trusted-rebuilds.js` deliberately lists
      # nothing for this workspace, so a restored tree is usable as-is and the
      # install can be skipped outright on a hit. That premise is HASHED, not
      # assumed: `trusted-rebuilds.js` is in the key, so the day a client
      # dependency does need a rebuild the key moves and no job can keep
      # restoring a never-rebuilt tree on an exact hit — which neither job here
      # has a stamp check to notice.
      - name: Cache client node_modules
        id: client-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client/node_modules
          key: client-modules-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('client/package-lock.json', 'client/package.json', 'client/.npmrc', 'scripts/trusted-rebuilds.js') }}

      - name: Install client dependencies
        if: steps.client-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix client

      - name: Cache Vitest transform artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            client/.cache/vitest
          key: vitest-client-${{ runner.os }}-${{ hashFiles('client/package-lock.json', 'client/vitest.config.js', 'scripts/vitestCiPool.js') }}-${{ matrix.shard }}of${{ strategy.job-total }}
          restore-keys: |
            vitest-client-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}-
            vitest-client-${{ runner.os }}-

      # These runners have their own page cache: the DB job's warm-up cannot
      # help client fixtures (#9641). Apply the same bounded mitigation here
      # and retain its duration alongside the fixtures' existing phase timings.
      # A passing launch is a non-reproduction, not proof of the startup cause.
      - name: Warm the Chrome install for client fixtures
        if: needs.impact.outputs.client_mode != 'skip'
        run: bash scripts/ci-warm-test-chrome.sh

      # Same contract as the server job's memo steps.
      - name: Restore the test memo
        if: needs.impact.outputs.client_mode != 'skip'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: test-memo-${{ runner.os }}-${{ runner.arch }}-client-${{ matrix.shard }}of${{ strategy.job-total }}-${{ github.run_id }}
          restore-keys: |
            test-memo-${{ runner.os }}-${{ runner.arch }}-client-${{ matrix.shard }}of${{ strategy.job-total }}-
            test-memo-${{ runner.os }}-${{ runner.arch }}-client-

      - name: Run client tests
        id: client-tests
        if: needs.impact.outputs.client_mode != 'skip'
        env:
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
          CI_TEST_MODE: ${{ needs.impact.outputs.client_mode }}
          CI_TEST_FILES: ${{ needs.impact.outputs.client_files }}
          CI_TEST_SOURCES: ${{ needs.impact.outputs.client_sources }}
          CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: node scripts/run-ci-tests.js client

      - name: Save the test memo
        if: steps.client-tests.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: test-memo-${{ runner.os }}-${{ runner.arch }}-client-${{ matrix.shard }}of${{ strategy.job-total }}-${{ github.run_id }}

      - name: Build client
        if: needs.impact.outputs.build == 'true' && matrix.shard == 1
        run: npm run build --prefix client

      - name: Retain frozen candidate invocation evidence
        if: always() && env.PORTOS_CI_TEST_POLICY == 'release-candidate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-diagnostics-client-${{ strategy.job-index || 0 }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/invocation.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/run.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/failures.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/processes.json

  lint:
    # Its own job rather than a step on client shard 1, for cost and latency —
    # NOT as a flake fix. Steps within one job run sequentially, so the ~31s of
    # Biome finished before `Run client tests` began and never contended with
    # it; #7448's shard-1 failures came from the tests themselves, not from what
    # else that job ran. What the split does buy: lint runs in parallel instead
    # of in front of the slowest shard, and a lint-only diff no longer starts a
    # client test job at all.
    #
    # It cannot instead move to a LATER shard: a scoped plan emits
    # `client_shards: [1]`, so a pin to the second shard would silently skip lint
    # on every impact-scoped pull request.
    #
    # It installs `client/` because Biome and its GritQL plugins are client
    # devDependencies. That install is shared with the client job through
    # `Cache client node_modules` below, so on a hit it is skipped entirely.
    name: Lint client
    needs: impact
    if: needs.impact.outputs.lint_mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # No `fetch-depth` and no `Resolve the pull-request diff base`, unlike the
      # test jobs: the linter's file list arrives from the impact plan, so this
      # job never diffs and a single-commit checkout is everything it needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `setup-node`'s npm cache only preserves ~/.npm, the tarball cache, so
      # `npm ci` still wipes and repopulates client/node_modules (393 MB, 21k
      # files — MORE files than the server tree the sibling cache already
      # serves) on every one of the four jobs that install this workspace.
      # Same exact-key/no-restore-keys shape as `Cache server node_modules`, and
      # for the same reason: a near-miss tree is not safe to reuse.
      #
      # No rebuild half, unlike the server: client/.npmrc pins
      # ignore-scripts=true AND `scripts/trusted-rebuilds.js` deliberately lists
      # nothing for this workspace, so a restored tree is usable as-is and the
      # install can be skipped outright on a hit. That premise is HASHED, not
      # assumed: `trusted-rebuilds.js` is in the key, so the day a client
      # dependency does need a rebuild the key moves and no job can keep
      # restoring a never-rebuilt tree on an exact hit — which neither job here
      # has a stamp check to notice.
      - name: Cache client node_modules
        id: client-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: client/node_modules
          key: client-modules-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('client/package-lock.json', 'client/package.json', 'client/.npmrc', 'scripts/trusted-rebuilds.js') }}

      - name: Install client dependencies
        if: steps.client-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix client

      - name: Lint client
        env:
          CI_LINT_MODE: ${{ needs.impact.outputs.lint_mode }}
          CI_LINT_FILES: ${{ needs.impact.outputs.lint_files }}
        run: node scripts/run-ci-lint.js

  database:
    # The serial Postgres suite. The browser suites used to run after it on
    # this job; they are now the `browser` job beside it, because together they
    # set the run's length more often than any other job.
    name: DB tests
    needs: impact
    if: needs.impact.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: portos
          POSTGRES_PASSWORD: portos
          POSTGRES_DB: portos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: portos
      PGPASSWORD: portos
      PORTOS_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Same entry and same contract as the server job — see it for the key, and
      # for why the install and rebuild below are gated on the mark rather than
      # on the cache hit.
      - name: Cache server node_modules
        id: server-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/node_modules
          key: server-modules-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('server/package-lock.json', 'server/package.json', 'server/.npmrc', 'scripts/trusted-rebuilds.js') }}

      # A restored tree is only reusable if it was rebuilt before it was saved,
      # and that is not answerable by looking at the tree — with today's
      # versions the rebuild is nearly a no-op, so every allowlisted package
      # imports fine on a never-rebuilt one. The rebuild step below leaves an
      # explicit mark; this reads it back.
      #
      # `continue-on-error` on purpose: a bad entry must not wedge every PR
      # until a human clears the cache by hand. It fails, the two steps below
      # see a non-success outcome, and the job builds the tree it needs. It does
      # not *replace* the bad entry — cache keys are immutable and actions/cache
      # skips the save on an exact hit — so that entry keeps costing each run a
      # reinstall until the key moves or it ages out. That is precisely the
      # pre-cache cost: the worst case degrades to the old behaviour, never to a
      # red repo.
      #
      # `outcome != 'success'` covers all three cases in one expression: on a
      # cache miss this step is skipped (outcome `skipped`), on a hit it is
      # `success` or `failure`.
      - name: Check the restored node_modules was rebuilt
        id: server-modules-usable
        if: steps.server-modules.outputs.cache-hit == 'true'
        continue-on-error: true
        run: node scripts/trusted-rebuild-stamp.js check server

      - name: Install server dependencies
        if: steps.server-modules-usable.outcome != 'success'
        run: npm ci --prefix server

      # server/.npmrc pins ignore-scripts=true, so the allowlisted packages need
      # this explicit rebuild. Same condition as the install: whenever this job
      # builds the tree it will cache, it must build a rebuilt one — and the
      # mark is written in the same block, so a failed rebuild cannot leave one
      # behind for a later job to trust.
      #
      # `shell: bash` is load-bearing, not style. windows-server would default
      # to pwsh, where a *native* command's non-zero exit neither throws nor
      # stops the block (`$PSNativeCommandUseErrorActionPreference` is false)
      # and only the last command's code becomes the step result — so a failed
      # rebuild would run the mark anyway, reset the exit code to 0, and publish
      # a green, marked, un-rebuilt tree. Under `bash -e` the block stops at
      # the rebuild, the job fails, and actions/cache (`post-if: success()`)
      # never saves it.
      - name: Rebuild trusted native dependencies
        if: steps.server-modules-usable.outcome != 'success'
        shell: bash
        env:
          # Skip onnxruntime-node's CUDA execution provider. Its postinstall
          # downloads it on linux-x64 whenever the .so is absent — several
          # hundred MB, on two jobs, every run — and no hosted runner has an
          # NVIDIA GPU to use it with. The CPU binaries ship in the tarball, so
          # inference still works; this is the single largest cost in the job.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          node scripts/trusted-rebuilds.js server
          node scripts/trusted-rebuild-stamp.js write server

      # Reuse Vite/Vitest artifacts from checkout-owned .cache paths, outside
      # node_modules (which may be shared by worktrees). Unlike the installed
      # dependency tree above, these artifacts can safely use a near-miss
      # restore and stay warm across a lockfile bump.
      - name: Cache Vitest transform artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/.cache/vitest
            server/.cache/vitest-db
          key: vitest-server-${{ runner.os }}-${{ hashFiles('server/package-lock.json', 'server/vitest.config.js', 'server/vitest.config.db.js', 'scripts/vitestCiPool.js') }}
          restore-keys: |
            vitest-server-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}-
            vitest-server-${{ runner.os }}-

      - name: Provision test database (portos_test)
        run: npm run setup:db:test --prefix server

      # Backup restore coverage takes a real pg_dump. The runner's default
      # PostgreSQL 16 client cannot dump the PostgreSQL 17 service above.
      #
      # The pull is ~95 ffmpeg dependency packages from the runner's mirror, and
      # a slow mirror has eaten this job's budget before any test ran (#10369,
      # #10562): apt's retries and timeouts cannot bound a connection that
      # trickles bytes. The script bounds the download, falls back from the
      # runner mirror to the official Ubuntu archive with signing intact, and
      # fails with an installation-failure annotation once its budget is spent.
      # The step timeout stays as a backstop above the script's own budget.
      - name: Install PostgreSQL client and audio verification tools
        timeout-minutes: 9
        env:
          PG_MAJOR: '17'
        run: bash scripts/ci-install-db-tools.sh

      # Same contract as the server job's memo steps. The Postgres schema is
      # not visible to a key; scripts/lib/testMemo.js lists the tracked files
      # that build it as db base inputs.
      - name: Restore the test memo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: test-memo-${{ runner.os }}-${{ runner.arch }}-db-${{ github.run_id }}
          restore-keys: |
            test-memo-${{ runner.os }}-${{ runner.arch }}-db-

      # Full mode: the runner subtracts what the memo verified and records the
      # `⏱ db full suite` duration line itself.
      - name: Run DB-backed tests (portos_test)
        id: db-tests
        env:
          PGDATABASE: portos_test
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
          CI_TEST_MODE: full
        run: node scripts/run-ci-tests.js db

      - name: Save the test memo
        if: steps.db-tests.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: test-memo-${{ runner.os }}-${{ runner.arch }}-db-${{ github.run_id }}

      - name: Retain frozen candidate invocation evidence
        if: always() && env.PORTOS_CI_TEST_POLICY == 'release-candidate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-diagnostics-database-${{ strategy.job-index || 0 }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/invocation.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/run.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/failures.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/processes.json

  browser:
    # Owns the registered browser suites; the Linux unit job excludes that
    # exact registry. PRs run the smoke profile; scheduled, release and
    # dispatched runs run the complete profile. No Postgres: the suites run on
    # the file backend under NODE_ENV=test. Two deterministic shards split the
    # aggregate capture workload without changing quiet-project sequencing or
    # the independent 720-second watchdog on either runner.
    name: Browser suites (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: impact
    if: needs.impact.outputs.browser_files != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
