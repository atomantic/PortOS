        env:
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
          PORTOS_BROWSER_TEST_PROFILE: ${{ github.event_name == 'pull_request' && github.base_ref != 'release' && inputs.full != true && 'smoke' || 'full' }}
          CI_TEST_MODE: files
          CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PORTOS_CI_BROWSER_OWNER: browser
          CI_TEST_FILES: ${{ needs.impact.outputs.browser_files }}
          PORTOS_REQUIRE_BROWSER_SUITES: '1'
          PORTOS_TEST_QUIET: 1
        run: node scripts/watch-ci-tests.js server

      - name: Save the test memo
        if: steps.browser-tests.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: test-memo-${{ runner.os }}-${{ runner.arch }}-browser-${{ matrix.shard }}of${{ strategy.job-total }}-${{ github.run_id }}

      - name: Preserve browser test failure diagnostics
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        env:
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
        run: node scripts/ci-test-diagnostics.js

      - name: Retain synthetic animatic mismatch pixels and frame metadata
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: animatic-capture-diagnostics-${{ matrix.shard }}of${{ strategy.job-total }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/animatic-capture/case-*/saved.png
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/animatic-capture/case-*/displayed.png
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/animatic-capture/case-*/frame.json

      - name: Retain frozen candidate invocation evidence
        if: always() && env.PORTOS_CI_TEST_POLICY == 'release-candidate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-diagnostics-browser-${{ strategy.job-index || 0 }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/invocation.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/run.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/failures.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/processes.json

  windows-server:
    # Native CLI/TUI, process and filesystem contracts; application suites run
    # in the primary server/client jobs. The planner emits one Windows runner.
    name: Windows native contracts
    needs: impact
    if: needs.impact.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      # A failing shard must not cancel its siblings: "Re-run failed jobs"
      # then repeats only the red shard instead of the whole matrix.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.impact.outputs.windows_shards) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # See the impact job: depth 2 is the whole PR merge ref, which is all
          # the planner needs to identify changed sources.
          fetch-depth: 2

      - name: Resolve the pull-request diff base
        run: node scripts/ci-base-sha.js

      - name: Use Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Same entry and same contract as the server job — see it for the key, and
      # for why the install and rebuild below are gated on the mark rather than
      # on the cache hit.
      - name: Cache server node_modules
        id: server-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/node_modules
          key: server-modules-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('server/package-lock.json', 'server/package.json', 'server/.npmrc', 'scripts/trusted-rebuilds.js') }}

      # A restored tree is only reusable if it was rebuilt before it was saved,
      # and that is not answerable by looking at the tree — with today's
      # versions the rebuild is nearly a no-op, so every allowlisted package
      # imports fine on a never-rebuilt one. The rebuild step below leaves an
      # explicit mark; this reads it back.
      #
      # `continue-on-error` on purpose: a bad entry must not wedge every PR
      # until a human clears the cache by hand. It fails, the two steps below
      # see a non-success outcome, and the job builds the tree it needs. It does
      # not *replace* the bad entry — cache keys are immutable and actions/cache
      # skips the save on an exact hit — so that entry keeps costing each run a
      # reinstall until the key moves or it ages out. That is precisely the
      # pre-cache cost: the worst case degrades to the old behaviour, never to a
      # red repo.
      #
      # `outcome != 'success'` covers all three cases in one expression: on a
      # cache miss this step is skipped (outcome `skipped`), on a hit it is
      # `success` or `failure`.
      - name: Check the restored node_modules was rebuilt
        id: server-modules-usable
        if: steps.server-modules.outputs.cache-hit == 'true'
        continue-on-error: true
        run: node scripts/trusted-rebuild-stamp.js check server

      - name: Install server dependencies
        if: steps.server-modules-usable.outcome != 'success'
        run: npm ci --prefix server

      # server/.npmrc pins ignore-scripts=true, so the allowlisted packages need
      # this explicit rebuild. Same condition as the install: whenever this job
      # builds the tree it will cache, it must build a rebuilt one — and the
      # mark is written in the same block, so a failed rebuild cannot leave one
      # behind for a later job to trust.
      #
      # `shell: bash` is load-bearing, not style. windows-server would default
      # to pwsh, where a *native* command's non-zero exit neither throws nor
      # stops the block (`$PSNativeCommandUseErrorActionPreference` is false)
      # and only the last command's code becomes the step result — so a failed
      # rebuild would run the mark anyway, reset the exit code to 0, and publish
      # a green, marked, un-rebuilt tree. Under `bash -e` the block stops at
      # the rebuild, the job fails, and actions/cache (`post-if: success()`)
      # never saves it.
      - name: Rebuild trusted native dependencies
        if: steps.server-modules-usable.outcome != 'success'
        shell: bash
        env:
          # Skip onnxruntime-node's CUDA execution provider. Its postinstall
          # downloads it on linux-x64 whenever the .so is absent — several
          # hundred MB, on two jobs, every run — and no hosted runner has an
          # NVIDIA GPU to use it with. The CPU binaries ship in the tarball, so
          # inference still works; this is the single largest cost in the job.
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          node scripts/trusted-rebuilds.js server
          node scripts/trusted-rebuild-stamp.js write server

      # Reuse Vite/Vitest artifacts from checkout-owned .cache paths, outside
      # node_modules (which may be shared by worktrees). Unlike the installed
      # dependency tree above, these artifacts can safely use a near-miss
      # restore and stay warm across a lockfile bump.
      - name: Cache Vitest transform artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            server/.cache/vitest
            server/.cache/vitest-db
          key: vitest-server-${{ runner.os }}-${{ hashFiles('server/package-lock.json', 'server/vitest.config.js', 'scripts/vitestCiPool.js') }}-${{ matrix.shard }}of${{ strategy.job-total }}
          restore-keys: |
            vitest-server-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}-
            vitest-server-${{ runner.os }}-

      - name: Check server entry-point syntax
        run: node --check server/index.js

      # Same contract as the server job's memo steps; the platform is part of
      # every key, so Windows reads only Windows verdicts.
      - name: Restore the test memo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: test-memo-${{ runner.os }}-${{ runner.arch }}-windows-server-${{ matrix.shard }}of${{ strategy.job-total }}-${{ github.run_id }}
          restore-keys: |
            test-memo-${{ runner.os }}-${{ runner.arch }}-windows-server-${{ matrix.shard }}of${{ strategy.job-total }}-
            test-memo-${{ runner.os }}-${{ runner.arch }}-windows-server-

      - name: Run server tests on Windows
        id: windows-tests
        # A step timeout FAILS the step (log kept, `if: failure()` reporting
        # runs); the job-level timeout would cancel the job and lose the log
        # (#10415). Scoped runs finish in a few minutes. A full shard has been
        # observed still passing tests at 15 minutes, so keep headroom under
        # the 40-minute job budget.
        timeout-minutes: 25
        env:
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
          # Outside the launcher's disposable temp root; recoverable after exit.
          CI_TEST_MODE: ${{ needs.impact.outputs.windows_mode }}
          CI_TEST_FILES: ${{ needs.impact.outputs.windows_files }}
          CI_TEST_SOURCES: ${{ needs.impact.outputs.windows_sources }}
          CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PORTOS_TEST_QUIET: 1
          PGPASSWORD: portos
          # Windows runners lose Vitest workers at startup with 0xC0000142
          # (STATUS_DLL_INIT_FAILED) under per-file process churn (#10114).
          PORTOS_CI_MAX_WORKERS: 2
          # Opts nativeTrash.smoke.test.js into the runner's real Recycle Bin (#12325).
          PORTOS_NATIVE_TRASH_SMOKE: 1
        run: node scripts/run-ci-tests.js server

      - name: Save the test memo
        if: steps.windows-tests.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: test-memo-${{ runner.os }}-${{ runner.arch }}-windows-server-${{ matrix.shard }}of${{ strategy.job-total }}-${{ github.run_id }}

      - name: Preserve Windows test failure diagnostics
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        env:
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
        run: node scripts/ci-test-diagnostics.js

      - name: Retain frozen candidate invocation evidence
        if: always() && env.PORTOS_CI_TEST_POLICY == 'release-candidate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-diagnostics-windows-server-${{ strategy.job-index || 0 }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/invocation.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/run.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/failures.json
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/processes.json

  node-minimum:
    name: Node minimum compatibility
    needs: impact
    if: needs.impact.outputs.node_minimum == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the minimum supported Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2

      - name: Verify the runtime gate
        run: node scripts/checkNodeVersion.js

      # Resolve every committed npm lockfile on the minimum runtime. The
      # workspace-level contract test below is the fail-closed engine check;
      # installs stay script-free so native rebuilds cannot turn this contract
      # job into a second application test suite.
      - name: Install all workspaces
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix client
          npm ci --ignore-scripts --prefix server
          npm ci --ignore-scripts --prefix autofixer

      - name: Run the Node compatibility contract
        run: npm run test:fast --prefix server -- ../scripts/checkNodeVersion.test.js ../scripts/node-version-drift.test.js

  linux-containment:
    name: Linux worker containment
    needs: impact
    if: needs.impact.outputs.linux_containment == 'true'
    # 22.04 allows unprivileged user namespaces without changing the runner's
    # AppArmor policy. Restricted hosts must remain fail-closed in the product.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install the containment prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix server
      - name: Exercise real namespaces, seccomp, limits and cancellation
        env:
          PORTOS_REQUIRE_LINUX_CONTAINMENT: '1'
        # Keep this list equal to the impact planner's LINUX_CONTAINMENT_TESTS:
        # the job is gated on those files' import closure.
        run: npm test --prefix server -- --run ../autofixer/sandbox.verify.test.js lib/codeAnimationContainment.test.js routes/codeAnimationExecution.test.js services/codeAnimation/containedWorker.test.js

  docker-containment-live:
    name: Docker containment live
    needs: impact
    # Path-gated by the impact planner's static import closure of the live
    # suite (DOCKER_CONTAINMENT_LIVE_ENTRIES), and part of CI Gate.
    if: needs.impact.outputs.docker_containment_live == 'true'
    # Native Docker Engine on a hosted runner. Docker Desktop on macOS is
    # verified manually (docs/CONTAINMENT.md); CI has no macOS Docker.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require maintainer release for Dependabot
        run: node scripts/ci-dependabot-admission.js
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix server
      - name: Prove the profile under a real engine
        working-directory: server
        env:
          PORTOS_DOCKER_CONTAINMENT_LIVE: '1'
        run: npx --no-install vitest run services/dockerContainment.live.test.js

  supercollider-live:
    name: SuperCollider native ${{ matrix.arch }}
    needs: impact
    # Path-gated by the impact planner's static import closure of the live
    # suite and setup script, and part of CI Gate: a red run blocks the merge.
    if: needs.impact.outputs.supercollider_live == 'true'
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    # Native runners only: emulation cannot prove either host's boundary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            nodeArch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            nodeArch: arm64
    runs-on: ${{ matrix.runner }}
    # The product build has a 90-minute cap; reserve time for installs and the
    # six real render/containment cases, including the bounded timeout case.
    timeout-minutes: 120
    env:
      EXPECTED_DOCKER_ARCH: ${{ matrix.arch }}
      EXPECTED_NODE_ARCH: ${{ matrix.nodeArch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require maintainer release for Dependabot
        run: node scripts/ci-dependabot-admission.js
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Verify the native Docker host
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const server = JSON.parse(execFileSync('docker', ['version', '--format', '{{json .Server}}'], { encoding: 'utf8' }));
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, process.env.EXPECTED_NODE_ARCH);
          assert.equal(server.Os, 'linux');
          assert.equal(server.Arch, process.env.EXPECTED_DOCKER_ARCH);
          console.log(`Docker ${server.Version}: ${server.Os}/${server.Arch}; Node ${process.version}: ${process.arch}`);
          NODE
          task_data_root="$RUNNER_TEMP/portos-supercollider-live"
          mkdir -p "$task_data_root"
          touch "$task_data_root/.portos-disposable-root"
          printf 'PORTOS_DATA_ROOT=%s\n' "$task_data_root" >> "$GITHUB_ENV"

      - name: Install test dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix server

      - name: Build and prove the shipped runtime
        run: |
          npm run setup:supercollider -- --yes | tee "$RUNNER_TEMP/supercollider-first-setup.log"
          cp "$PORTOS_DATA_ROOT/data/supercollider/runtime-evidence.json" "$RUNNER_TEMP/supercollider-first-evidence.json"

      - name: Repeat setup and prove it skipped build and probe
        run: |
          npm run setup:supercollider -- --yes | tee "$RUNNER_TEMP/supercollider-second-setup.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const firstLog = readFileSync(join(process.env.RUNNER_TEMP, 'supercollider-first-setup.log'), 'utf8');
          const secondLog = readFileSync(join(process.env.RUNNER_TEMP, 'supercollider-second-setup.log'), 'utf8');
          const before = readFileSync(join(process.env.RUNNER_TEMP, 'supercollider-first-evidence.json'), 'utf8');
          const after = readFileSync(join(process.env.PORTOS_DATA_ROOT, 'data/supercollider/runtime-evidence.json'), 'utf8');
          assert.match(firstLog, /^✅ Image built$/m);
          assert.match(firstLog, /^✅ Synthetic render probe passed$/m);
          assert.match(secondLog, /^✅ Image already current — skipped the build$/m);
          assert.doesNotMatch(secondLog, /^✅ Image built$|^.*Synthetic render probe/m);
          assert.equal(after, before, 'The second setup must retain the first probe evidence unchanged');
          const evidence = JSON.parse(after);
          assert.equal(evidence.ok, true);
          assert.equal(evidence.platform.os, 'linux');
          assert.equal(evidence.platform.arch, process.env.EXPECTED_DOCKER_ARCH);
          console.log('Both setup runs passed; the second built no image and ran no probe.');
          NODE

      - name: Exercise real synthesis and containment
        working-directory: server
        env:
          PORTOS_SUPERCOLLIDER_LIVE: '1'
        run: npx --no-install vitest run services/superColliderRender.live.test.js

      - name: Record the proven platform
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const evidence = JSON.parse(readFileSync(join(process.env.PORTOS_DATA_ROOT, 'data/supercollider/runtime-evidence.json'), 'utf8'));
          const release = readFileSync('/etc/os-release', 'utf8');
          const os = release.match(/^PRETTY_NAME="([^"]+)"$/m)?.[1] ?? 'Linux';
          const lines = [
            `### ${os} / ${evidence.platform.arch}`,
            '',
            `Docker Engine: ${evidence.platform.dockerVersion}`,
            `Runtime: ${evidence.runtimeVersion}; containment policy: ${evidence.policyVersion}`,
            `Image: ${evidence.imageId}`,
            'Setup: first build and probe passed; second skipped both with unchanged evidence.',
            'Live suite: all six synthesis and containment cases passed.',
            '',
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          for (const line of lines.filter(Boolean)) console.log(line);
          NODE

  gate:
    name: CI Gate
    if: always()
    needs: [impact, prompt-history, server, client, lint, database, browser, windows-server, node-minimum, linux-containment, docker-containment-live, supercollider-live]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # READ only: the reporter lists this run's jobs to name the one whose STEP
    # failed when a mid-step cancel hid the job's `failure` conclusion.
    permissions:
      contents: read
      actions: read
    steps:
      # The gate needs the repo only for scripts/ci-gate-report.js, which
      # imports Node builtins only — no dependency install, no setup-node.
      # `sparse-checkout` switches the fetch to a blob:none partial clone, so
      # this costs ~1.7 MB and ~1k files instead of ~20 MB and ~8.4k — and the
      # gate is the fan-in job every required check waits on. Cone mode always
      # includes the repo root, which is where package.json ("type": "module")
      # has to come from for the script to load as ESM.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      # A CANCELLED run and a FAILED one are different events with different
      # responses, and collapsing them sent readers hunting for a test failure
      # that did not exist (#7437). Each CI_GATE_RESULT_<JOB> variable names one
      # job; adding a job to the gate is one line here and no code change.
      - name: Require every selected job to pass
        env:
          # Lets the reporter read this run's job steps when the verdict would
          # otherwise be a bare "cancelled" — see scripts/ci-gate-report.js.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GATE_LABEL: CI Gate
          CI_GATE_RESULT_IMPACT: ${{ needs.impact.result }}
          CI_GATE_RESULT_PROMPT_HISTORY: ${{ needs.prompt-history.result }}
          CI_GATE_RESULT_SERVER: ${{ needs.server.result }}
          CI_GATE_RESULT_CLIENT: ${{ needs.client.result }}
          CI_GATE_RESULT_LINT: ${{ needs.lint.result }}
          CI_GATE_RESULT_DATABASE: ${{ needs.database.result }}
          CI_GATE_RESULT_BROWSER: ${{ needs.browser.result }}
          CI_GATE_RESULT_WINDOWS_SERVER: ${{ needs.windows-server.result }}
          CI_GATE_RESULT_NODE_MINIMUM: ${{ needs.node-minimum.result }}
          CI_GATE_RESULT_LINUX_CONTAINMENT: ${{ needs.linux-containment.result }}
          CI_GATE_RESULT_DOCKER_CONTAINMENT_LIVE: ${{ needs.docker-containment-live.result }}
          CI_GATE_RESULT_SUPERCOLLIDER_LIVE: ${{ needs.supercollider-live.result }}
        run: node scripts/ci-gate-report.js

      # A red scheduled run tested the combined tree with no PR attached, so name
      # the merges since the last green one instead of leaving a hand bisect.
      # Diagnostic only; the step above already failed the gate.
      - name: Name the suspect merges
        if: failure() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-nightly-report.js

  full-gate:
    # A second check run published ONLY when the impact plan chose the complete
    # suite. release.yml keys on this name to skip re-running CI on the push to
    # `release`; the aggregate "CI Gate" above cannot serve that purpose,
    # because an impact-scoped PR run publishes a green "CI Gate" too.
    # It mirrors the aggregate gate rather than re-aggregating every job, so it
    # costs one comparison instead of a second fan-in.
    name: Full CI Gate
    # Full supported coverage means full primary suites plus the native
    # Windows contract set. A primary-only full plan with Windows skipped
    # cannot supply the release-reuse marker.
    if: always() && needs.impact.outputs.full == 'true' && needs.impact.outputs.windows_mode == 'files' && (github.event_name != 'pull_request' || github.base_ref == 'release' || inputs.full == true)
    needs: [impact, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      # Same reporter, one input: a cancelled aggregate gate must not read as a
      # red complete suite on the release path either.
      - name: Require the aggregate gate to have passed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GATE_LABEL: Full CI Gate
          # Strict: a `skipped` gate must not satisfy this one. Unlike the
          # aggregate gate, whose per-job `skipped` is the impact plan doing
          # its job, this check is what lets release.yml skip re-running the
          # complete suite (scripts/verify-ci-status.js).
          CI_GATE_REQUIRE_SUCCESS: 'true'
          CI_GATE_RESULT_GATE: ${{ needs.gate.result }}
        run: node scripts/ci-gate-report.js
