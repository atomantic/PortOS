name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release]
  schedule:
    # Twice a day: catches what a push run cannot, such as a dependency or
    # runner change with no commit behind it.
    - cron: '17 9 * * *'
    - cron: '17 21 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run the complete server, client, DB, lint, build, and smoke suite
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'schedule' && 'schedule') || github.ref }}
  # A newer PR push supersedes the run in flight. On main the run in flight
  # finishes and only the newest waiting push runs next (GitHub cancels a
  # pending run when a newer one queues, and its tree contains the older
  # ones): with merges minutes apart, cancelling in flight meant no push run
  # ever finished, so main went untested and never saved the memo records
  # that related selection narrows with (#16424). `github.ref` is the
  # caller's ref when release.yml calls this workflow. The schedule has its
  # own group: in the ref group it was the pending run a merge to main
  # dropped before it started, so the enforced guard budget, ungated native
  # jobs, cache seeding and Full CI Gate silently lapsed for 12 hours.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Plan test impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A called workflow inherits the caller's event, and release.yml calls this
    # one from a push.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    # actions: read lets a push to main find its last green CI run
    # (scripts/ci-base-sha.js); nothing else in this job calls the API.
    permissions:
      contents: read
      actions: read
    outputs:
      # Every planner decision as one JSON object, read as
      # `fromJSON(needs.impact.outputs.plan).<key>` (githubPlanOutput() in
      # scripts/ci-test-plan.js; a test fails on a key it does not emit). A
      # new gated job adds a key there and reads it in its own `if:`.
      plan: ${{ steps.plan.outputs.plan }}
      # JSON arrays of shard indexes — `[1]` for a scoped plan, `[1..n]` for a
      # full one. Each leaf job builds its matrix from these, because a
      # job-level `if` cannot read `matrix` and so cannot skip extra shards on
      # its own. See FULL_SUITE_SHARDS in scripts/ci-test-plan.js.
      server_shards: ${{ steps.plan.outputs.server_shards }}
      client_shards: ${{ steps.plan.outputs.client_shards }}
      browser_shards: ${{ steps.plan.outputs.browser_shards }}
      windows_shards: ${{ steps.plan.outputs.windows_shards }}
      # The DB job's `services:` image cannot run a script, so it reads the
      # reference docker-compose.yml pins through this job's output.
      db_image: ${{ steps.db-image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 2, not full history: a pull_request checkout is the merge ref,
          # so depth 2 carries both of its parents — which is everything the
          # planner (a three-dot diff against the base parent) and `git
          # ls-files` need. Cloning every commit in the repo buys nothing more.
          fetch-depth: 2

      # A red impact job keeps CI Gate red; skipped test jobs are not evidence.
      # Re-running this run is GitHub's writer-only, exact-SHA release control.
      - name: Require maintainer release for Dependabot
        run: node scripts/ci-impact-diagnostics.js admission -- node scripts/ci-dependabot-admission.js

      # Reads the base commit off HEAD^1 rather than the event payload, so a
      # depth-2 clone is enough for every three-dot diff downstream. Exports
      # CI_BASE_SHA to the rest of the job. On a push to main (not a release
      # workflow_call, which passes inputs.full) it also exports
      # CI_GATED_BASE_SHA, the last green push or schedule run's head, fetched
      # at depth 1; a failed lookup exports nothing and every native job runs.
      # CI_PREDECESSOR_GREEN_SHA is that sha only when it is this push's first
      # parent: the planner then runs the generated-data plan for a diff that
      # is only the quality snapshot (#18457).
      - name: Resolve the pull-request diff base
        env:
          CI_GATED_BASE_LOOKUP: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.full != true }}
          GITHUB_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.full != true && github.token || '' }}
        run: node scripts/ci-impact-diagnostics.js base -- node scripts/ci-base-sha.js

      # Before any reviewer — human or model — reads this diff. Pattern
      # matching over the added lines only: invisible Unicode and compressed or
      # opaque encoded payloads are content the diff hides from the person
      # approving it, so a hit fails the run rather than being reported. Every
      # other job needs this one, so the whole suite stops here.
      - name: Scan the diff for hidden content
        run: node scripts/ci-impact-diagnostics.js hidden-content -- node scripts/scan-diff-hidden-content.js

      # Linux resolves `./Foo.js` only as spelled; macOS and Windows do not, so
      # a macOS-only run cannot see that failure. Checked here on every pull
      # request.
      - name: Check relative imports match the tracked path case
        run: node scripts/ci-impact-diagnostics.js import-case -- node scripts/check-import-case.js

      - name: Resolve the pinned database image
        id: db-image
        run: echo "image=$(node scripts/lib/dbImage.js)" >> "$GITHUB_OUTPUT"

      - name: Select affected test surfaces
        id: plan
        env:
          # `inputs.full` is only decisive for a caller that invokes this
          # reusable workflow from a pull_request-triggered workflow — every
          # call site in this repo comes from a push, which the first clause
          # already covers. It stays honored so the declared input is real.
          CI_FORCE_FULL: ${{ github.event_name != 'pull_request' || inputs.full == true }}
          # The planner turns a PR into `release` into a full plan: that PR is
          # the single gate a release ships behind, so it never runs scoped.
          CI_BASE_REF: ${{ github.base_ref }}
        run: node scripts/ci-impact-diagnostics.js plan -- node scripts/ci-test-plan.js

      # The entry-point syntax check must not ride a skippable job.
      - name: Check server entry-point syntax
        run: node scripts/ci-impact-diagnostics.js syntax -- node --check server/index.js

      # This precedes checkout post-actions and runner finalization; it cannot
      # attest that the hosted runner acknowledged the completed job.
      - name: Record impact process settlement
        if: always()
        run: node scripts/ci-impact-diagnostics.js settlement

  server:
    # Sharded on a full plan — see docs/CI_TEST_SELECTION.md "Full-suite sharding".
    # The matrix comes from the planner; once-only steps pin to shard 1, and the
    # transform-artifact cache key carries the shard so parallel saves don't race.
    name: Server tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: impact
    if: fromJSON(needs.impact.outputs.plan).server_mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A failing shard must not cancel its siblings: "Re-run failed jobs"
      # then repeats only the red shard instead of the whole matrix.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.impact.outputs.server_shards) }}
    permissions:
      contents: read
    env:
      PORTOS_CI_BROWSER_OWNER: unit
      CI_TEST_MODE: ${{ fromJSON(needs.impact.outputs.plan).server_mode }}
      CI_TEST_FILES: ${{ toJSON(fromJSON(needs.impact.outputs.plan).server_files) }}
      CI_TEST_SOURCES: ${{ toJSON(fromJSON(needs.impact.outputs.plan).server_sources) }}
      CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # See the impact job: depth 2 is the whole PR merge ref, which is all
          # the planner needs to identify changed sources.
          fetch-depth: 2

      - uses: ./.github/actions/diff-base

      - uses: ./.github/actions/setup-server
        with:
          vitest-key-suffix: -${{ matrix.shard }}of${{ strategy.job-total }}

      # The submodule ships no source into this checkout by default (see
      # AGENTS.md "Slashdo Commands"), so the planner's `slashdo` output is
      # the only signal that the selected tests need it — an unrelated scoped
      # PR must not pay for the fetch. `CI_EXPECT_SLASHDO_SUBMODULE` below
      # tells the two contract suites to fail instead of skip if this step
      # somehow leaves the checkout without it.
      - name: Initialize slashdo submodule
        if: fromJSON(needs.impact.outputs.plan).slashdo
        run: git submodule update --init --depth 1 lib/slashdo || git submodule update --init lib/slashdo

      - name: Check CTC test selection
        id: ctc-selection
        run: node scripts/run-ci-tests.js server --check-ctc

      # scripts/ml/align_lyrics_ctc_test.py skips its Viterbi cases without numpy
      # and still exits 0 (issue #15676). When the plan runs that suite, cache and
      # restore a venv with the repo's numpy pin and make the suite fail rather
      # than skip if no numpy interpreter resolves. Never touches system Python.
      - name: Cache CTC numpy virtualenv
        id: ctc-venv-cache
        if: steps.ctc-selection.outputs.required == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ctc-venv
          key: ctc-venv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ml/requirements/requirements-acestep-mlx.txt') }}

      - name: Provide numpy for the CTC Viterbi tests
        if: steps.ctc-selection.outputs.required == 'true'
        run: |
          if [ "${{ steps.ctc-venv-cache.outputs.cache-hit }}" != "true" ]; then
            pin="$(grep -m1 -E '^numpy==' scripts/ml/requirements/requirements-acestep-mlx.txt)"
            python3 -m venv "$RUNNER_TEMP/ctc-venv"
            "$RUNNER_TEMP/ctc-venv/bin/python" -m pip install --quiet "$pin"
          fi
          "$RUNNER_TEMP/ctc-venv/bin/python" -I -c 'import numpy'
          echo "PORTOS_TEST_PYTHON=$RUNNER_TEMP/ctc-venv/bin/python" >> "$GITHUB_ENV"
          echo "CI_EXPECT_NUMPY_PYTHON=true" >> "$GITHUB_ENV"

      # The test memo (docs/TEST_MEMO.md): pull requests only
      # read; trusted full runs save (see the action for the key lineage).
      - name: Restore the test memo
        id: test-memo
        uses: ./.github/actions/test-memo
        with:
          suite: server
          partition: server-${{ matrix.shard }}of${{ strategy.job-total }}
          # FULL_SUITE_SHARDS.server; scripts/ci-test-memo-cache.test.js pins it.
          # A full run executes only its own partition, so sibling lineages
          # are merged only for scoped plans (recordedReach narrowing).
          merge-shards: ${{ fromJSON(needs.impact.outputs.plan).server_mode == 'full' && '0' || '2' }}

      - name: Run server tests
        id: server-tests
        if: fromJSON(needs.impact.outputs.plan).server_mode != 'skip'
        env:
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
          CI_EXPECT_SLASHDO_SUBMODULE: ${{ fromJSON(needs.impact.outputs.plan).slashdo }}
          # The always-run guards' time budget (each structural guard runner's checks,
          # and every other always-run file whole) fails the run only on the
          # twice-daily schedule, where a regression is still caught within 12
          # hours without runner noise blocking a PR, push or release. Every other
          # event reports it as a warning (scripts/lib/guardBudget.js, #16551, #16810, #16996).
          CI_GUARD_BUDGET: ${{ github.event_name == 'schedule' && 'enforce' || 'report' }}
          # Keep successful-test output signal-dense. Developers can reproduce
          # locally without this flag when assertion context needs app logs.
          PORTOS_TEST_QUIET: 1
          # The documented local fallback; setting it avoids one warning per
          # isolated test file without changing DB selection or credentials.
          PGPASSWORD: portos
          # The launcher ends its own test tree and prints the log at this wall-clock deadline (#18636), below the outer limit.
          PORTOS_CI_TEST_DEADLINE_MINUTES: 25
        run: node scripts/run-ci-tests.js server

      # Only trusted runs on the default/release branches seed the memo, and
      # only from a green test step: the runner writes no entry from a red
      # process, and a step that never ran has nothing to save. Each shard
      # saves on its own as soon as its tests pass, so a later failure or
      # cancellation elsewhere in the run does not lose its records.
      - name: Save the test memo
        if: steps.server-tests.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: ${{ steps.test-memo.outputs.key }}

      # Smoke-boot does not need Postgres: NODE_ENV=test selects the file
      # backend. It does need the native rebuild (server boot loads node-pty),
      # which is why it lives on this job rather than a third installer.
      - name: Smoke-boot server
        if: fromJSON(needs.impact.outputs.plan).smoke && matrix.shard == 1
        run: npm run smoke

  client:
    name: Client tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: impact
    if: fromJSON(needs.impact.outputs.plan).client_mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A failing shard must not cancel its siblings: "Re-run failed jobs"
      # then repeats only the red shard instead of the whole matrix.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.impact.outputs.client_shards) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # See the impact job: depth 2 is the whole PR merge ref, which is all
          # the planner needs to identify changed sources.
          fetch-depth: 2

      - uses: ./.github/actions/diff-base

      - uses: ./.github/actions/setup-client

      # A PR-saved cache is private to its merge ref and never read again, so PRs only restore.
      - name: Cache Vitest transform artifacts (restore only on pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            client/.cache/vitest
          key: vitest-client-${{ runner.os }}-${{ hashFiles('client/package-lock.json', 'client/vitest.config.js', 'scripts/vitestCiPool.js') }}-${{ matrix.shard }}of${{ strategy.job-total }}
          restore-keys: |
            vitest-client-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}-
            vitest-client-${{ runner.os }}-

      - name: Cache Vitest transform artifacts
        if: github.event_name != 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            client/.cache/vitest
          key: vitest-client-${{ runner.os }}-${{ hashFiles('client/package-lock.json', 'client/vitest.config.js', 'scripts/vitestCiPool.js') }}-${{ matrix.shard }}of${{ strategy.job-total }}
          restore-keys: |
            vitest-client-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}-
            vitest-client-${{ runner.os }}-

      # Chrome is warmed by the test runner only when this shard actually
      # launches a browser suite (#17750).
      - name: Restore the test memo
        id: test-memo
        uses: ./.github/actions/test-memo
        with:
          suite: client
          partition: client-${{ matrix.shard }}of${{ strategy.job-total }}
          # FULL_SUITE_SHARDS.client; scripts/ci-test-memo-cache.test.js pins it.
          # A full run executes only its own partition, so sibling lineages
          # are merged only for scoped plans (recordedReach narrowing).
          merge-shards: ${{ fromJSON(needs.impact.outputs.plan).client_mode == 'full' && '0' || '6' }}

      - name: Run client tests
        id: client-tests
        env:
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
          CI_TEST_MODE: ${{ fromJSON(needs.impact.outputs.plan).client_mode }}
          CI_TEST_FILES: ${{ toJSON(fromJSON(needs.impact.outputs.plan).client_files) }}
          CI_TEST_SOURCES: ${{ toJSON(fromJSON(needs.impact.outputs.plan).client_sources) }}
          CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          # The launcher ends its own test tree and prints the log at this wall-clock deadline (#18636), below the outer limit.
          PORTOS_CI_TEST_DEADLINE_MINUTES: 25
        run: node scripts/run-ci-tests.js client

      - name: Save the test memo
        if: steps.client-tests.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: ${{ steps.test-memo.outputs.key }}

  client-build:
    name: Build client
    needs: impact
    if: fromJSON(needs.impact.outputs.plan).build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-client

      - run: npm run build --prefix client

  lint:
    # Its own job rather than a step on client shard 1, for cost and latency —
    # NOT as a flake fix. Steps within one job run sequentially, so the ~31s of
    # Biome finished before `Run client tests` began and never contended with
    # it; #7448's shard-1 failures came from the tests themselves, not from what
    # else that job ran. What the split does buy: lint runs in parallel instead
    # of in front of the slowest shard, and a lint-only diff no longer starts a
    # client test job at all.
    #
    # It cannot instead move to a LATER shard: a scoped plan emits
    # `client_shards: [1]`, so a pin to the second shard would silently skip lint
    # on every impact-scoped pull request.
    #
    # It installs `client/` because Biome and its GritQL plugins are client
    # devDependencies. That install is shared with the client job through the
    # setup-client action's cache, so on a hit it is skipped entirely.
    name: Lint client
    needs: impact
    if: fromJSON(needs.impact.outputs.plan).lint_mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # No `fetch-depth` and no `Resolve the pull-request diff base`, unlike the
      # test jobs: the linter's file list arrives from the impact plan, so this
      # job never diffs and a single-commit checkout is everything it needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-client

      - name: Lint client
        env:
          CI_LINT_MODE: ${{ fromJSON(needs.impact.outputs.plan).lint_mode }}
          CI_LINT_FILES: ${{ toJSON(fromJSON(needs.impact.outputs.plan).lint_files) }}
        run: node scripts/run-ci-lint.js

      # GitHub silently skips a workflow it rejects, so a bad file never fails a
      # check; actionlint is the only pre-merge proof. The pinned version and
      # archive checksum live only in scripts/lib/actionlint.js.
      - name: Install pinned actionlint
        if: fromJSON(needs.impact.outputs.plan).workflow_lint
        run: node scripts/install-actionlint.js

      - name: Lint workflows with actionlint
        if: fromJSON(needs.impact.outputs.plan).workflow_lint
        env:
          CI_LINT_MODE: ${{ fromJSON(needs.impact.outputs.plan).lint_mode }}
          CI_LINT_FILES: ${{ toJSON(fromJSON(needs.impact.outputs.plan).lint_files) }}
        run: node scripts/run-actionlint.js

      # Proves the check still bites: the #15657 shape must be rejected with the
      # runner-context diagnostic. A nonzero exit alone also means a missing
      # shellcheck or a broken launch, which would be a silent no-op.
      - name: Prove actionlint rejects the known-bad fixture
        if: fromJSON(needs.impact.outputs.plan).workflow_lint
        run: |
          fixture=scripts/fixtures/actionlint/runner-context-in-job-env.yml
          out=$(node scripts/run-actionlint.js "$fixture" 2>&1) && { echo "$out"; echo "::error::actionlint accepted the known-bad fixture"; exit 1; }
          echo "$out"
          grep -F 'context "runner" is not allowed here' <<< "$out" || { echo "::error::expected runner-context diagnostic missing"; exit 1; }

  database:
    # The serial Postgres suite. The browser suites used to run after it on
    # this job; they are now the `browser` job beside it, because together they
    # set the run's length more often than any other job.
    name: DB tests
    needs: impact
    if: fromJSON(needs.impact.outputs.plan).db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: ${{ needs.impact.outputs.db_image }}
        env:
          POSTGRES_USER: portos
          POSTGRES_PASSWORD: portos
          POSTGRES_DB: portos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: portos
      PGPASSWORD: portos
      PORTOS_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-server

      # The Postgres schema is not visible to a cache key; scripts/lib/testMemo.js
      # lists the tracked files that build it as db base inputs.
      - name: Restore the test memo
        id: test-memo
        uses: ./.github/actions/test-memo
        with:
          suite: db
          partition: db

      - name: Check remaining DB tests
        id: db-plan
        env:
          PGDATABASE: portos_test
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          CI_TEST_MODE: full
        run: node scripts/run-ci-tests.js db --check-remaining

      - name: Provision test database (portos_test)
        if: fromJSON(steps.db-plan.outputs.remaining) > 0 || fromJSON(needs.impact.outputs.plan).db_live_restore
        run: npm run setup:db:test --prefix server

      # pg_dump must match the service major. The step timeout backs up the
      # helper's 390-second download budget.
      - name: Install PostgreSQL client and audio verification tools
        if: fromJSON(steps.db-plan.outputs.remaining) > 0 || fromJSON(needs.impact.outputs.plan).db_live_restore
        timeout-minutes: 9
        uses: ./.github/actions/db-tools
        with:
          pg-major: '17'

      # A real pg_dump from the service's pinned image, checked by
      # inspectDatabaseDump, prepared by prepareDatabaseReplay and replayed into
      # a scratch database, then the startup maintenance-schema probe. Outside
      # the memo, so a missing Docker engine, image or psql fails instead of
      # becoming a cached pass.
      - name: Restore a real pg_dump into a scratch database
        if: fromJSON(needs.impact.outputs.plan).db_live_restore
        timeout-minutes: 5
        env:
          PORTOS_DB_RESTORE_LIVE: '1'
          PGMODE: native
        run: cd server && npx --no-install vitest run services/backupDatabaseDump.restore.live.test.js

      # Full mode: the runner subtracts what the memo verified and records the
      # `⏱ db full suite` duration line itself.
      - name: Run DB-backed tests (portos_test)
        id: db-tests
        if: fromJSON(steps.db-plan.outputs.remaining) > 0 || fromJSON(needs.impact.outputs.plan).db_live_restore
        env:
          PGDATABASE: portos_test
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
          CI_TEST_MODE: full
          # The launcher ends its own test tree and prints the log at this wall-clock deadline (#18636), below the outer limit.
          PORTOS_CI_TEST_DEADLINE_MINUTES: 15
        run: node scripts/run-ci-tests.js db

      - name: Save the test memo
        if: steps.db-tests.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: ${{ steps.test-memo.outputs.key }}

  browser:
    # Owns the registered browser suites; the Linux unit job excludes that
    # exact registry. PRs run the smoke profile; scheduled, release and
    # dispatched runs run the complete profile. No Postgres: the suites run on
    # the file backend under NODE_ENV=test. The planner keeps one-, two-, and
    # four-shard scoped plans and gives broad plans seven runners. Quiet-project
    # sequencing and the per-runner watchdog are unchanged.
    name: Browser suites (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: impact
    if: fromJSON(needs.impact.outputs.plan).browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTOS_BROWSER_TEST_PROFILE: ${{ github.event_name == 'pull_request' && github.base_ref != 'release' && inputs.full != true && 'smoke' || 'full' }}
    strategy:
      # Keep every shard's evidence if another fails; CI Gate requires all.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.impact.outputs.browser_shards) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-server
        with:
          vitest-key-suffix: -browser-${{ matrix.shard }}of${{ strategy.job-total }}

      # Smoke can use every trusted full-run lineage because smaller
      # selections can use different shard owners. Per-test keys still require
      # compatible inputs and coverage.
      - name: Restore the test memo
        id: test-memo
        uses: ./.github/actions/test-memo
        with:
          suite: browser
          partition: browser-${{ matrix.shard }}of${{ strategy.job-total }}
          merge-shards: ${{ env.PORTOS_BROWSER_TEST_PROFILE == 'smoke' && '7' || '0' }}
          legacy-shards: '4'

      # Plan before installing ffmpeg/client deps so shards 100% covered by the
      # memo skip both. Uses the same env keys as the test step below.
      - name: Check remaining browser suites
        id: browser-plan
        env:
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          CI_TEST_MODE: files
          CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PORTOS_CI_BROWSER_OWNER: browser
          CI_TEST_FILES: ${{ toJSON(fromJSON(needs.impact.outputs.plan).browser_files) }}
          PORTOS_REQUIRE_BROWSER_SUITES: '1'
          PORTOS_TEST_QUIET: 1
          PORTOS_CI_BEFORE_AUDIO_SETUP: '1'
        run: node scripts/run-ci-tests.js server --check-remaining

      # The step timeout backs up the helper's download budget.
      - name: Install audio verification tools
        if: fromJSON(steps.browser-plan.outputs.remaining) > 0
        timeout-minutes: 9
        uses: ./.github/actions/db-tools
        with:
          include-postgres: 'false'

      - name: Recheck browser suites after audio setup
        id: browser-recheck
        if: steps.browser-plan.outputs.recheck == 'true'
        env:
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          CI_TEST_MODE: files
          CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PORTOS_CI_BROWSER_OWNER: browser
          CI_TEST_FILES: ${{ toJSON(fromJSON(needs.impact.outputs.plan).browser_files) }}
          PORTOS_REQUIRE_BROWSER_SUITES: '1'
          PORTOS_TEST_QUIET: 1
        run: node scripts/run-ci-tests.js server --check-remaining

      # The test runner reads the runner's Chrome tree into the page cache
      # (scripts/ci-warm-test-chrome.sh, #9641) only when a suite will run (#17750).
      - uses: ./.github/actions/setup-client
        if: fromJSON(steps.browser-recheck.outputs.remaining || steps.browser-plan.outputs.remaining) > 0
        with:
          setup-node: 'false'

      # Fail-closed: PORTOS_REQUIRE_BROWSER_SUITES makes the suites' canRun guard
      # throw (see server/lib/browserSuiteGate.js) when Chrome, ffmpeg or the
      # client bundler is missing, so a skip can never pass this step.
      - name: Run cross-workspace browser suites
        id: browser-tests
        if: fromJSON(steps.browser-recheck.outputs.remaining || steps.browser-plan.outputs.remaining) > 0
        # The independent supervisor emits progress and owns a 12m deadline;
        # this 15m step limit is only a fallback before the 20m job boundary.
        timeout-minutes: 15
        env:
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
          CI_TEST_MODE: files
          CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PORTOS_CI_BROWSER_OWNER: browser
          CI_TEST_FILES: ${{ toJSON(fromJSON(needs.impact.outputs.plan).browser_files) }}
          PORTOS_REQUIRE_BROWSER_SUITES: '1'
          PORTOS_TEST_QUIET: 1
        run: node scripts/watch-ci-tests.js server

      - name: Save the test memo
        if: steps.browser-tests.outcome == 'success' && steps.browser-tests.outputs.memo-written == 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: ${{ steps.test-memo.outputs.key }}

      - name: Preserve browser test failure diagnostics
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        env:
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
        run: node scripts/ci-test-diagnostics.js

      - name: Retain synthetic animatic mismatch pixels and frame metadata
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: animatic-capture-diagnostics-${{ matrix.shard }}of${{ strategy.job-total }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/animatic-capture/case-*/saved.png
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/animatic-capture/case-*/displayed.png
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/animatic-capture/case-*/frame.json

      - name: Retain synthetic template parity pixels and media state
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-parity-diagnostics-${{ matrix.shard }}of${{ strategy.job-total }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/template-parity/case-*/native.png
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/template-parity/case-*/engine.png
            ${{ runner.temp }}/portos-ci-diagnostics/portos-vitest-*/template-parity/case-*/parity.json

  windows-server:
    # Native CLI/TUI, process and filesystem contracts; application suites run
    # in the primary server/client jobs. The planner emits one Windows runner.
    name: Windows native contracts
    needs: impact
    if: fromJSON(needs.impact.outputs.plan).windows
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      # A failing shard must not cancel its siblings: "Re-run failed jobs"
      # then repeats only the red shard instead of the whole matrix.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.impact.outputs.windows_shards) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # See the impact job: depth 2 is the whole PR merge ref, which is all
          # the planner needs to identify changed sources.
          fetch-depth: 2

      - uses: ./.github/actions/diff-base

      - uses: ./.github/actions/setup-server
        with:
          vitest-key-suffix: -${{ matrix.shard }}of${{ strategy.job-total }}

      - name: Check server entry-point syntax
        run: node --check server/index.js

      # The platform is part of every memo key, so Windows reads only Windows verdicts.
      - name: Restore the test memo
        id: test-memo
        uses: ./.github/actions/test-memo
        with:
          suite: windows-server
          partition: windows-server-${{ matrix.shard }}of${{ strategy.job-total }}

      - name: Run server tests on Windows
        id: windows-tests
        # A step timeout FAILS the step (log kept, `if: failure()` reporting
        # runs); the job-level timeout would cancel the job and lose the log
        # (#10415). Scoped runs finish in a few minutes. A full shard has been
        # observed still passing tests at 15 minutes, so keep headroom under
        # the 40-minute job budget. The step timeout alone did not end a hung
        # run on 2026-11-24 and the log was lost, so the launcher also bounds
        # itself with PORTOS_CI_TEST_DEADLINE_MINUTES below (#18636); this
        # timeout stays as the outer fallback.
        timeout-minutes: 25
        env:
          PORTOS_TEST_MEMO_DIR: ${{ runner.temp }}/portos-test-memo
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
          # Outside the launcher's disposable temp root; recoverable after exit.
          CI_TEST_MODE: ${{ fromJSON(needs.impact.outputs.plan).windows_mode }}
          CI_TEST_FILES: ${{ toJSON(fromJSON(needs.impact.outputs.plan).windows_files) }}
          CI_TEST_SOURCES: ${{ toJSON(fromJSON(needs.impact.outputs.plan).windows_sources) }}
          CI_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PORTOS_TEST_QUIET: 1
          PGPASSWORD: portos
          # Windows runners lose Vitest workers at startup with 0xC0000142
          # (STATUS_DLL_INIT_FAILED) under per-file process churn (#10114).
          PORTOS_CI_MAX_WORKERS: 2
          # Opts nativeTrash.smoke.test.js into the runner's real Recycle Bin (#12325).
          PORTOS_NATIVE_TRASH_SMOKE: 1
          # The launcher ends its own test tree and prints the log at this wall-clock deadline (#18636), below the outer limit.
          PORTOS_CI_TEST_DEADLINE_MINUTES: 20
        run: node scripts/run-ci-tests.js server

      - name: Save the test memo
        if: steps.windows-tests.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/portos-test-memo
          key: ${{ steps.test-memo.outputs.key }}

      - name: Preserve Windows test failure diagnostics
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        env:
          PORTOS_CI_DIAGNOSTICS_DIR: ${{ runner.temp }}/portos-ci-diagnostics
        run: node scripts/ci-test-diagnostics.js

  node-minimum:
    name: Node minimum compatibility
    needs: impact
    if: fromJSON(needs.impact.outputs.plan).node_minimum
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the minimum supported Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.2

      - name: Verify the runtime gate
        run: node scripts/checkNodeVersion.js

      # Resolve every committed npm lockfile on the minimum runtime. The
      # workspace-level contract test below is the fail-closed engine check;
      # installs stay script-free so native rebuilds cannot turn this contract
      # job into a second application test suite.
      - name: Install all workspaces
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix client
          npm ci --ignore-scripts --prefix server

      - name: Run the Node compatibility contract
        run: npm run test:fast --prefix server -- ../scripts/checkNodeVersion.test.js ../scripts/node-version-drift.guard.test.js

      - name: Use the Node 22 security minimum
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4

      - name: Verify the setup security gate
        run: node scripts/checkNodeVersion.js --security

  linux-containment:
    name: Linux worker containment
    needs: impact
    if: fromJSON(needs.impact.outputs.plan).linux_containment
    # 22.04 allows unprivileged user namespaces without changing the runner's
    # AppArmor policy. Restricted hosts must remain fail-closed in the product.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install test dependencies
        run: npm ci --ignore-scripts --prefix server
      - name: Install containment prerequisite and exercise real namespaces, seccomp, limits and cancellation
        env:
          PORTOS_REQUIRE_LINUX_CONTAINMENT: '1'
        # Keep this list equal to the impact planner's LINUX_CONTAINMENT_TESTS:
        # the job is gated on those files' import closure.
        run: bash scripts/ci-install-containment-tools.sh npm test --prefix server -- --run ../autofixer/sandbox.verify.test.js lib/codeAnimationContainment.test.js routes/codeAnimationExecution.test.js services/codeAnimation/containedWorker.test.js ../scripts/ci-install-containment-tools.test.js

  docker-containment-live:
    name: Docker containment live
    # Impact must succeed before this job can install or execute dependencies.
    needs: impact
    # Path-gated by the impact planner's static import closure of the live
    # suite (DOCKER_CONTAINMENT_LIVE_ENTRIES), and part of CI Gate.
    if: fromJSON(needs.impact.outputs.plan).docker_containment_live
    # Native Docker Engine on a hosted runner. Docker Desktop on macOS is
    # verified manually (docs/CONTAINMENT.md); CI has no macOS Docker.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix server
      - name: Prove the profile under a real engine
        working-directory: server
        env:
          PORTOS_DOCKER_CONTAINMENT_LIVE: '1'
        run: npx --no-install vitest run services/dockerContainment.live.test.js

  macos-native:
    name: macOS native release-agent supervision
    needs: impact
    # Path-gated by the impact planner's MACOS_NATIVE_PATH_RE, and part of CI
    # Gate. These suites skip on every other platform (#14781).
    if: fromJSON(needs.impact.outputs.plan).macos_native
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The PTY cases need node-pty's native addon, which only setup-server's
      # trusted rebuild builds.
      - uses: ./.github/actions/setup-server
        with:
          vitest-key-suffix: -macos-native

      # The supervisor bootstraps a single-use launchd job; without a domain
      # that accepts it every release agent stays held. Fail here, by name,
      # instead of as an opaque assertion inside the suite.
      - name: Probe the launchd user domain
        run: python3 -I server/lib/darwinAgentSupervisor.py --probe
      - name: Run the macOS release-agent supervision suites
        timeout-minutes: 15
        # Keep this list equal to the impact planner's MACOS_NATIVE_TESTS.
        run: npm test --prefix server -- --run lib/windowsAgentProcess.darwin.test.js

  supercollider-live:
    name: SuperCollider native ${{ matrix.arch }}
    # Impact must succeed before this job can install or execute dependencies.
    needs: impact
    # Path-gated by the impact planner's static import closure of the live
    # suite and setup script, and part of CI Gate: a red run blocks the merge.
    if: fromJSON(needs.impact.outputs.plan).supercollider_live
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    # Native runners only: emulation cannot prove either host's boundary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            nodeArch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            nodeArch: arm64
    runs-on: ${{ matrix.runner }}
    # The product build has a 90-minute cap; reserve time for installs and the
    # six real render/containment cases, including the bounded timeout case.
    timeout-minutes: 120
    env:
      EXPECTED_DOCKER_ARCH: ${{ matrix.arch }}
      EXPECTED_NODE_ARCH: ${{ matrix.nodeArch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: supercollider-node
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Verify the native Docker host
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const server = JSON.parse(execFileSync('docker', ['version', '--format', '{{json .Server}}'], { encoding: 'utf8' }));
          assert.equal(process.platform, 'linux');
          assert.equal(process.arch, process.env.EXPECTED_NODE_ARCH);
          assert.equal(server.Os, 'linux');
          assert.equal(server.Arch, process.env.EXPECTED_DOCKER_ARCH);
          console.log(`Docker ${server.Version}: ${server.Os}/${server.Arch}; Node ${process.version}: ${process.arch}`);
          NODE
          task_data_root="$RUNNER_TEMP/portos-supercollider-live"
          mkdir -p "$task_data_root"
          touch "$task_data_root/.portos-disposable-root"
          printf 'PORTOS_DATA_ROOT=%s\n' "$task_data_root" >> "$GITHUB_ENV"

      - name: Restore script-free server dependencies
        id: supercollider-dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/node_modules
          key: supercollider-server-ignore-scripts-${{ matrix.arch }}-${{ steps.supercollider-node.outputs.node-version }}-${{ hashFiles('server/package-lock.json', 'server/.npmrc') }}

      - name: Install root dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install server dependencies without lifecycle scripts
        if: steps.supercollider-dependencies.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --prefix server

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore SuperCollider build layers
        id: supercollider-layers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sc-buildx-cache
          key: supercollider-buildx-${{ matrix.arch }}-${{ hashFiles('docker/supercollider/**') }}

      - name: Build and prove the shipped runtime
        # Exact hits only import layers. A cold build exports layers while
        # still loading the runtime image for the first setup's probe.
        env:
          PORTOS_SUPERCOLLIDER_BUILDX_CACHE_FROM: ${{ steps.supercollider-layers.outputs.cache-hit == 'true' && format('{0}/sc-buildx-cache', runner.temp) || '' }}
          PORTOS_SUPERCOLLIDER_BUILDX_CACHE_TO: ${{ steps.supercollider-layers.outputs.cache-hit != 'true' && format('{0}/sc-buildx-cache', runner.temp) || '' }}
        run: |
          npm run setup:supercollider -- --yes --verbose | tee "$RUNNER_TEMP/supercollider-first-setup.log"
          cp "$PORTOS_DATA_ROOT/data/supercollider/runtime-evidence.json" "$RUNNER_TEMP/supercollider-first-evidence.json"

      - name: Verify installed Debian security fixes
        run: |
          runtime_image=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync(process.env.PORTOS_DATA_ROOT + '/data/supercollider/runtime-evidence.json', 'utf8')).imageId)")
          docker run --rm --network none --entrypoint sh "$runtime_image" -euc '
            apt_version=$(dpkg-query -W -f="\${Version}" apt)
            ssl_version=$(dpkg-query -W -f="\${Version}" libssl3t64)
            printf "apt %s; libssl3t64 %s\n" "$apt_version" "$ssl_version"
            dpkg --compare-versions "$apt_version" ge 3.0.4
            dpkg --compare-versions "$ssl_version" ge "3.5.7-1~deb13u3"
          '

      - name: Repeat setup and prove it skipped build and probe
        run: |
          npm run setup:supercollider -- --yes | tee "$RUNNER_TEMP/supercollider-second-setup.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const firstLog = readFileSync(join(process.env.RUNNER_TEMP, 'supercollider-first-setup.log'), 'utf8');
          const secondLog = readFileSync(join(process.env.RUNNER_TEMP, 'supercollider-second-setup.log'), 'utf8');
          const before = readFileSync(join(process.env.RUNNER_TEMP, 'supercollider-first-evidence.json'), 'utf8');
          const after = readFileSync(join(process.env.PORTOS_DATA_ROOT, 'data/supercollider/runtime-evidence.json'), 'utf8');
          assert.match(firstLog, /^✅ Image built$/m);
          assert.match(firstLog, /^✅ Synthetic render probe passed$/m);
          assert.match(secondLog, /^✅ Image already current — skipped the build$/m);
          assert.doesNotMatch(secondLog, /^✅ Image built$|^.*Synthetic render probe/m);
          assert.equal(after, before, 'The second setup must retain the first probe evidence unchanged');
          const evidence = JSON.parse(after);
          assert.equal(evidence.ok, true);
          assert.equal(evidence.platform.os, 'linux');
          assert.equal(evidence.platform.arch, process.env.EXPECTED_DOCKER_ARCH);
          console.log('Both setup runs passed; the second built no image and ran no probe.');
          NODE

      - name: Exercise real synthesis and containment
        working-directory: server
        env:
          PORTOS_SUPERCOLLIDER_LIVE: '1'
        run: npx --no-install vitest run services/superColliderRender.live.test.js

      - name: Record the proven platform
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const evidence = JSON.parse(readFileSync(join(process.env.PORTOS_DATA_ROOT, 'data/supercollider/runtime-evidence.json'), 'utf8'));
          const release = readFileSync('/etc/os-release', 'utf8');
          const os = release.match(/^PRETTY_NAME="([^"]+)"$/m)?.[1] ?? 'Linux';
          const lines = [
            `### ${os} / ${evidence.platform.arch}`,
            '',
            `Docker Engine: ${evidence.platform.dockerVersion}`,
            `Runtime: ${evidence.runtimeVersion}; containment policy: ${evidence.policyVersion}`,
            `Image: ${evidence.imageId}`,
            'Setup: first build and probe passed; second skipped both with unchanged evidence.',
            'Live suite: all six synthesis and containment cases passed.',
            '',
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n'));
          for (const line of lines.filter(Boolean)) console.log(line);
          NODE

      # Only successful runs on the default branch publish these caches.
      - name: Save script-free server dependencies
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.supercollider-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: server/node_modules
          key: ${{ steps.supercollider-dependencies.outputs.cache-primary-key }}

      - name: Save SuperCollider build layers
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.supercollider-layers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sc-buildx-cache
          key: ${{ steps.supercollider-layers.outputs.cache-primary-key }}

  gate:
    name: CI Gate
    if: always()
    needs: [impact, server, client, client-build, lint, database, browser, windows-server, node-minimum, linux-containment, docker-containment-live, macos-native, supercollider-live]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # READ only: the reporter lists this run's jobs to name the one whose STEP
    # failed when a mid-step cancel hid the job's `failure` conclusion.
    permissions:
      contents: read
      actions: read
    steps:
      # The gate needs the repo only for scripts/ci-gate-report.js, which
      # imports Node builtins only — no dependency install, no setup-node.
      # `sparse-checkout` switches the fetch to a blob:none partial clone, so
      # this costs ~1.7 MB and ~1k files instead of ~20 MB and ~8.4k — and the
      # gate is the fan-in job every required check waits on. Cone mode always
      # includes the repo root, which is where package.json ("type": "module")
      # has to come from for the script to load as ESM.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      # A CANCELLED run and a FAILED one are different events with different
      # responses, and collapsing them sent readers hunting for a test failure
      # that did not exist (#7437). Each CI_GATE_RESULT_<JOB> variable names one
      # job; adding a job to the gate is one line here and no code change.
      - name: Require every selected job to pass
        env:
          # Lets the reporter read this run's job steps when the verdict would
          # otherwise be a bare "cancelled" — see scripts/ci-gate-report.js.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GATE_LABEL: CI Gate
          CI_GATE_RESULT_IMPACT: ${{ needs.impact.result }}
          CI_GATE_RESULT_SERVER: ${{ needs.server.result }}
          CI_GATE_RESULT_CLIENT: ${{ needs.client.result }}
          CI_GATE_RESULT_CLIENT_BUILD: ${{ needs.client-build.result }}
          CI_GATE_RESULT_LINT: ${{ needs.lint.result }}
          CI_GATE_RESULT_DATABASE: ${{ needs.database.result }}
          CI_GATE_RESULT_BROWSER: ${{ needs.browser.result }}
          CI_GATE_RESULT_WINDOWS_SERVER: ${{ needs.windows-server.result }}
          CI_GATE_RESULT_NODE_MINIMUM: ${{ needs.node-minimum.result }}
          CI_GATE_RESULT_LINUX_CONTAINMENT: ${{ needs.linux-containment.result }}
          CI_GATE_RESULT_DOCKER_CONTAINMENT_LIVE: ${{ needs.docker-containment-live.result }}
          CI_GATE_RESULT_MACOS_NATIVE: ${{ needs.macos-native.result }}
          CI_GATE_RESULT_SUPERCOLLIDER_LIVE: ${{ needs.supercollider-live.result }}
        run: node scripts/ci-gate-report.js


  full-gate:
    # A second check run published ONLY when the impact plan chose the complete
    # suite. release.yml keys on this name to skip re-running CI on the push to
    # `release`; the aggregate "CI Gate" above cannot serve that purpose,
    # because an impact-scoped PR run publishes a green "CI Gate" too.
    # It mirrors the aggregate gate rather than re-aggregating every job, so it
    # costs one comparison instead of a second fan-in.
    name: Full CI Gate
    # Full supported coverage means full primary suites plus the native
    # Windows contract set. A primary-only full plan with Windows skipped
    # cannot supply the release-reuse marker, and neither can a push whose
    # native jobs were gated on its diff (native_gated).
    if: always() && needs.impact.result == 'success' && fromJSON(needs.impact.outputs.plan).full && fromJSON(needs.impact.outputs.plan).windows_mode == 'files' && !fromJSON(needs.impact.outputs.plan).native_gated && (github.event_name != 'pull_request' || github.base_ref == 'release' || inputs.full == true)
    needs: [impact, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      # Same reporter, one input: a cancelled aggregate gate must not read as a
      # red complete suite on the release path either.
      - name: Require the aggregate gate to have passed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_GATE_LABEL: Full CI Gate
          # Strict: a `skipped` gate must not satisfy this one. Unlike the
          # aggregate gate, whose per-job `skipped` is the impact plan doing
          # its job, this check is what lets release.yml skip re-running the
          # complete suite (scripts/verify-ci-status.js).
          CI_GATE_REQUIRE_SUCCESS: 'true'
          CI_GATE_RESULT_GATE: ${{ needs.gate.result }}
        run: node scripts/ci-gate-report.js
