name: Release

on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  # The candidate -> release pull request already ran the complete suite on the very
  # tree this push carries. Look for that green gate instead of paying for it
  # twice; anything unverified (a direct push to release, a merge that changed
  # the tree, an API failure) still falls through to the full run below.
  verify-ci:
    name: Check for an existing full CI run
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      # Depth 2 so both parents of the release merge commit — and their trees —
      # are available to compare against the tree being released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Look for a passing Full CI Gate on this tree
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-ci-status.js

      - name: Publish verification summary
        env:
          VERIFIED: ${{ steps.check.outputs.verified }}
          REASON: ${{ steps.check.outputs.reason }}
        run: |
          {
            echo "### Release CI verification"
            echo
            echo "- Already verified: \`${VERIFIED}\`"
            echo "- Reason: \`${REASON}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  full-ci:
    needs: verify-ci
    if: needs.verify-ci.outputs.verified != 'true'
    # A called workflow's jobs cannot hold a permission the calling job lacks,
    # so this grants what ci.yml's gate jobs read (`actions: read`, to name a
    # failed step) and scopes full-ci DOWN from the workflow-level
    # `contents: write` the release job needs; ci.yml only ever checks out.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  release:
    needs: [verify-ci, full-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip version bump commits. Every other reason a release must not ship is
    # reported loudly by the step below rather than silently skipping the job —
    # a silent skip is what leaves a tag with no GitHub Release behind it.
    if: always() && !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # full-ci is skipped exactly when verify-ci found a green gate for this
      # tree, so 'skipped' is a pass here and only a run that actually executed
      # and failed blocks the release.
      - name: Report release failure on CI failure
        if: needs.verify-ci.result != 'success' || needs.full-ci.result == 'failure' || needs.full-ci.result == 'cancelled'
        env:
          VERIFY_RESULT: ${{ needs.verify-ci.result }}
          FULL_CI_RESULT: ${{ needs.full-ci.result }}
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ]; then
            BECAUSE="the CI verification job status was '$VERIFY_RESULT'"
          else
            BECAUSE="full-ci status was '$FULL_CI_RESULT'"
          fi
          echo "::error::release v${VERSION} did NOT publish because ${BECAUSE}"
          echo "release v${VERSION} did NOT publish"
          exit 1

      - name: Check if release exists
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.package-version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # A tag that already exists is never retargeted by the release action, so
      # it must already sit on the tree CI verified. Fails closed, read-only.
      - name: Verify existing release tag matches this tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.package-version.outputs.version }}
        run: node scripts/verify-release-tag.js

      - name: Generate changelog
        id: changelog
        if: steps.release-check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"

          # .changelog/RELEASE.md holds only the notes of the release being cut
          # and is overwritten per release; GitHub Releases is the archive. A
          # file for another version is a release-preparation defect, so
          # scripts/release-title.js fails the step on a heading/package.json
          # mismatch instead of publishing stale notes. The commit-log fallback
          # applies only when the file is missing.
          CHANGELOG_FILE=".changelog/RELEASE.md"

          if [ -f "$CHANGELOG_FILE" ]; then
            CHANGELOG=$(cat "$CHANGELOG_FILE")
          else
            # Fallback: Generate changelog from commits (exclude [skip ci] commits)
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
            COMMIT_LOG=$(git log "$PREV_TAG..HEAD" --pretty='format:- %s' --no-merges | grep -v "\[skip ci\]" | head -50)

            # Create a basic changelog structure
            CHANGELOG="# Release v${VERSION}

          ## Changes

          ${COMMIT_LOG}

          ## Installation

          \`\`\`bash
          git clone https://github.com/atomantic/PortOS.git
          cd PortOS
          npm run install:all
          pm2 start ecosystem.config.cjs
          \`\`\`"
          fi

          # The release agent names the release in the first changelog heading.
          # The same script that resolves the title rejects a version mismatch
          # and notes over 100 KB, so the published body is always complete
          # (GitHub's limit is 125,000 chars; there is no file to link to for a
          # truncated remainder).
          BODY_FILE="$RUNNER_TEMP/release-body.md"
          printf '%s\n' "$CHANGELOG" > "$BODY_FILE"
          RELEASE_TITLE=$(node scripts/release-title.js "$VERSION" "$BODY_FILE")
          if [ "$RELEASE_TITLE" = "Release v${VERSION}" ]; then
            echo "::warning::release notes have no named first heading; using the fallback title '$RELEASE_TITLE'"
          fi

          # The body goes through body_path (not an action input env var) so a
          # large changelog cannot exceed ARG_MAX when the action is exec'd.
          echo "body_path=$BODY_FILE" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      # The preinstalled gh CLI replaces a third-party release action: it is the
      # only publication path in this privileged contents:write job. --target
      # creates a missing tag at the exact commit CI verified; without it GitHub
      # resolves a new tag against main's tip, which can have moved. A tag that
      # already exists is never retargeted by this step (the check above guards it).
      - name: Create Release
        if: steps.release-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.package-version.outputs.version }}
          RELEASE_TITLE: ${{ steps.changelog.outputs.release_title }}
          BODY_FILE: ${{ steps.changelog.outputs.body_path }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$BODY_FILE"

      - name: Confirm published tag is on the verified tree
        if: steps.release-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.package-version.outputs.version }}
          REQUIRE_TAG: 'true'
        run: node scripts/verify-release-tag.js
